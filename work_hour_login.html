<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work Hour Approval · Datacell</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;background:#17273b;color:#e8eef6}button,input,select{font:inherit}button{cursor:pointer;padding:10px 16px;border:1px solid #c6aa4b;border-radius:6px;background:#ffdb58;color:#162538;font-weight:700}button.secondary{background:#fff;border-color:#ccc}button:disabled{opacity:.5;cursor:wait}input{width:100%;padding:10px;border:1px solid #b7c3d1;border-radius:5px;color:#14263c;background:#fff}label{display:block;margin:14px 0 5px;font-weight:700;font-size:12px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 24px;border-bottom:1px solid #42546a}h1{font-size:22px;margin:0}h2{font-size:18px;margin:0 0 8px}p{line-height:1.5}#login{max-width:460px;margin:8vh auto;padding:30px;background:#fff;color:#17273b;border-radius:14px}#login button{margin-top:20px;width:100%}.message{min-height:20px;margin:10px 0;color:#c14629}.hint{font-size:12px;color:#536377}#app{display:none}nav{display:flex;gap:10px;padding:12px 24px}#dashboard{width:100%;height:calc(100dvh - 145px);min-height:450px;border:0;background:#fff}#manage{display:none;padding:18px 24px;background:#eef1f5;color:#14263c;min-height:calc(100dvh - 140px)}.grid{display:grid;grid-template-columns:minmax(230px,1fr) minmax(550px,2fr);gap:20px}.card{background:#fff;border:1px solid #cbd3de;border-radius:8px;padding:20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.permissions{width:100%;border-collapse:collapse;margin:18px 0}.permissions td,.permissions th{padding:9px;border:1px solid #b3bdc9;font-size:12px;text-align:center}.permissions td:first-child{text-align:left}.permissions input,input[type=checkbox]{width:auto}.user{display:block;width:100%;text-align:left;margin:10px 0;background:#f8fafc;border-color:#a9b5c4}.user small{display:block;margin-top:5px;font-weight:400}#who{font-size:13px}.actions{display:flex;gap:10px;align-items:center}#loginForm label{font-size:13px}a{color:#146bb1}@media(max-width:850px){.grid,.fields{grid-template-columns:1fr}.card{overflow:auto}header{padding:12px}nav{padding:10px}#login{margin:30px 12px}h1{font-size:18px}}
</style></head><body>
<header><div><h1>Work Hour Approval</h1><small>Datacell · Epyllion Knitwears Limited-HW</small></div><div class="actions"><span id="who"></span><button id="logout" hidden>Logout</button></div></header>
<section id="login"><h2 id="loginTitle">Sign in</h2><p class="hint" id="loginHint">Use your assigned email and password.</p><form id="loginForm"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><div id="setupFields" hidden><label for="setupName">User Name</label><input id="setupName"><label for="setupDepartment">Department</label><input id="setupDepartment"><label for="setupSection">Section (Optional)</label><input id="setupSection"><label for="setupDesignation">Designation</label><input id="setupDesignation"><label for="setupOffice">Office ID Number</label><input id="setupOffice"></div><button id="signIn" type="submit">Login</button><p class="message" id="loginMessage" role="status"></p></form></section>
<section id="app"><nav><button id="openReport">Work Hour Approval</button><button id="openUsers" hidden>User & Tab Access</button></nav><iframe id="dashboard" title="Work Hour Approval reports"></iframe><section id="manage"><div class="grid"><div class="card"><h2>Users</h2><button id="newUser">+ Add User</button><div id="userList"></div></div><div class="card"><h2 id="editTitle">Add User</h2><form id="userForm"><div class="fields"><div><label>Email</label><input name="email" type="email" required autocomplete="off"></div><div><label>Password <span id="passwordHint">(min. 10 characters)</span></label><input name="password" type="password" minlength="10" autocomplete="new-password"></div><div><label>User Name</label><input name="user_name" required maxlength="200"></div><div><label>Department</label><input name="department" required maxlength="200" list="departments"></div><div><label>Section (Optional)</label><input name="section" maxlength="200" list="sections"></div><div><label>Designation</label><input name="designation" required maxlength="200"></div><div><label>Office ID Number</label><input name="office_id" required maxlength="200"></div><div><label><input name="active" type="checkbox" checked> Account active</label></div></div><datalist id="departments"></datalist><datalist id="sections"></datalist><table class="permissions"><thead><tr><th>Tab</th><th>View</th><th>Edit / Entry</th><th>Delete</th><th>Export</th></tr></thead><tbody id="permissionRows"></tbody></table><button id="saveUser" type="submit">Save User & Access</button><p class="message" id="userMessage" role="status"></p></form></div></div></section></section>
<script src="work_hour_portal.js?build=20261007_1"></script></body></html>
