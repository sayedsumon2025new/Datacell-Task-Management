  // Global stats strip
  const strip=document.createElement('div');
  strip.style.cssText='display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px';
  [{l:'Total Tasks',v:tasks.length,c:'#f5c842'},{l:'Completed',v:withActual,c:'#3ef0b0'},{l:'Pending',v:tasks.length-totalDone,c:'#f5c842'},{l:'Completed Late',v:lateCount,c:'#f87171'},{l:'Done Rate',v:pct+'%',c:'#60a5fa'}]
    .forEach(x=>{
      const el=document.createElement('div');
      el.style.cssText='background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 16px;display:flex;align-items:center;gap:10px';
      el.innerHTML='<span style="font-family:Syne,sans-serif;font-size:1.4rem;font-weight:800;color:'+x.c+'">'+x.v+'</span><span style="font-size:.66rem;font-family:DM Mono,monospace;color:var(--muted)">'+x.l+'</span>';
      strip.appendChild(el);
    });
  c.appendChild(strip);

  // Overall progress bar
  const prog=document.createElement('div');prog.className='prog-sect';prog.style.marginBottom='18px';
  prog.innerHTML='<div class="prog-info"><span>'+(overviewDate?formatDateDisplay(overviewDate):'ALL DATES')+' · '+totalDone+'/'+tasks.length+' DONE</span><strong style="color:#f5c842">'+pct+'%</strong></div><div class="prog-track"><div class="prog-fill" style="width:'+pct+'%;background:linear-gradient(90deg,#3ef0b0,#f5c842)"></div></div>';
  c.appendChild(prog);

  // Team cards
  const teamLbl=document.createElement('div');teamLbl.className='section-title';teamLbl.textContent='TEAM BREAKDOWN';c.appendChild(teamLbl);
  const grid=document.createElement('div');grid.className='admin-grid';
  allP.forEach(p=>{
    const t2=th(p),mt=tasks.filter(k=>k.person===p).map(k=>taskForDate(k,overviewDate)),dn=mt.filter(completedOnDate).length;
    const pp=mt.length?Math.round((dn/mt.length)*100):0;
    const late=mt.filter(k=>completedOnDate(k)&&timeCmp(k.planDate,k.planTime,k.actualDate,k.actualTime)==='late').length;
    const early=mt.filter(k=>completedOnDate(k)&&['early','ontime'].includes(timeCmp(k.planDate,k.planTime,k.actualDate,k.actualTime))).length;
    const card=document.createElement('div');card.className='apc';card.style.borderColor=t2.accent+'22';
    card.innerHTML='<div style="position:absolute;top:0;left:0;right:0;height:2px;background:'+t2.accent+'"></div>'
      +'<div class="apc-hd"><div class="apc-av" style="background:'+t2.bg+';color:'+t2.color+'">'+ini(p)+'</div>'
      +'<div><div class="apc-nm" style="color:'+t2.color+'">'+p+'</div><div class="apc-tk">'+mt.length+' tasks</div></div></div>'
      +'<div class="apc-bar"><div class="apc-fill" style="width:'+pp+'%;background:'+t2.accent+'"></div></div>'
      +'<div class="apc-ct"><span>'+dn+' done</span><span>'+(mt.length-dn)+' pending</span><span style="color:'+t2.color+'">'+pp+'%</span></div>'
      +(early||late?'<div style="margin-top:6px;display:flex;gap:8px;font-size:.62rem;font-family:DM Mono,monospace">'+(early?'<span style="color:#3ef0b0">&#10003;'+early+' ontime</span>':'')+(late?'<span style="color:#f87171">&#10007;'+late+' late</span>':'')+'</div>':'');
    grid.appendChild(card);
  });
  c.appendChild(grid);

  // ── CALENDAR ──
  const calLbl=document.createElement('div');calLbl.className='section-title';calLbl.style.marginTop='24px';calLbl.textContent='TASK CALENDAR';c.appendChild(calLbl);

  // Legend
  const legend=document.createElement('div');legend.className='ovcal-legend';
  legend.innerHTML=
    '<div class="ovcal-legend-item"><div class="ovcal-legend-dot" style="background:#3ef0b0"></div>Completed</div>'
    +'<div class="ovcal-legend-item"><div class="ovcal-legend-dot" style="background:#f5c842"></div>Today</div>'
    +'<div class="ovcal-legend-item"><div class="ovcal-legend-dot" style="background:#f87171;border-radius:2px"></div>Overdue</div>';
  c.appendChild(legend);

  const ovCalBox=document.createElement('div');ovCalBox.className='cal-wrap';c.appendChild(ovCalBox);
  const ovDayWrap=document.createElement('div');ovDayWrap.id='ovDayWrap';c.appendChild(ovDayWrap);

  function buildOvCal(){
    ovCalBox.innerHTML='';
    const today=localISODate();
    const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
    const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    // Build date maps
    // Calendar is based only on actual completion dates.
    const planMap={},actualMap={};
    tasks.forEach(k=>{
      if(k.actualDate&&isTaskComplete(k)){if(!actualMap[k.actualDate])actualMap[k.actualDate]=[];actualMap[k.actualDate].push(k);}
    });

    // Header
    const hdr=document.createElement('div');hdr.className='cal-header';
    hdr.innerHTML='<button class="cal-nav" id="ovCalPrev">&#8592;</button>'
      +'<div class="cal-title">'+MONTHS[ovCalMonth]+' '+ovCalYear+'</div>'
      +'<button class="cal-nav" id="ovCalNext">&#8594;</button>';
    ovCalBox.appendChild(hdr);

    // Day names
    const daysHdr=document.createElement('div');daysHdr.className='cal-days-hdr';
    DAYS.forEach(d=>{const el=document.createElement('div');el.className='cal-day-hdr';el.textContent=d;daysHdr.appendChild(el);});
    ovCalBox.appendChild(daysHdr);

    // Grid
    const calGrid=document.createElement('div');calGrid.className='cal-grid';
    const firstDay=new Date(ovCalYear,ovCalMonth,1).getDay();
    const daysInMonth=new Date(ovCalYear,ovCalMonth+1,0).getDate();
    const daysInPrev=new Date(ovCalYear,ovCalMonth,0).getDate();

    // Prev month filler
    for(let i=firstDay-1;i>=0;i--){
      const cell=document.createElement('div');cell.className='cal-cell other-month';
      cell.innerHTML='<div class="cal-date-num">'+(daysInPrev-i)+'</div>';
      calGrid.appendChild(cell);
    }

    // Days
    for(let d=1;d<=daysInMonth;d++){
      const dateStr=ovCalYear+'-'+String(ovCalMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      const planTasks=planMap[dateStr]||[];
      const actualTasks=actualMap[dateStr]||[];
      const isToday=dateStr===today;
      const isSelected=dateStr===ovCalSelected;
      const hasAny=planTasks.length||actualTasks.length;

      const cell=document.createElement('div');
      cell.className='cal-cell'+(isToday?' today':'')+(hasAny?' has-tasks':'')+(isSelected?' selected':'');
      cell.dataset.date=dateStr;

      let html='<div class="cal-date-num">'+d+'</div>';
      if(hasAny){
        html+='<div class="cal-dot-row">';
        // Plan dots (blue)
        planTasks.slice(0,3).forEach(k=>{
          const overdue=k.planDate<today&&!k.actualDate;
          html+='<div class="cal-dot" style="background:'+(overdue?'#f87171':'#3b82f6')+'" title="Plan: '+k.task+'"></div>';
        });
        if(planTasks.length>3)html+='<span style="font-size:.48rem;font-family:DM Mono,monospace;color:#60a5fa">+'+( planTasks.length-3)+'</span>';
        // Actual dots (green)
        actualTasks.slice(0,3).forEach(k=>{
          const t2=th(k.person);
          html+='<div class="cal-dot" style="background:'+t2.accent+';border:1px solid rgba(255,255,255,.2)" title="Done: '+k.task+'"></div>';
        });
        if(actualTasks.length>3)html+='<span style="font-size:.48rem;font-family:DM Mono,monospace;color:#3ef0b0">+'+( actualTasks.length-3)+'</span>';
        html+='</div>';
        // count line
        const parts=[];
        if(planTasks.length)parts.push('<span style="color:#60a5fa">'+planTasks.length+'p</span>');
        if(actualTasks.length)parts.push('<span style="color:#3ef0b0">'+actualTasks.length+'d</span>');
        html+='<div style="font-family:DM Mono,monospace;font-size:.55rem;margin-top:2px;display:flex;gap:3px">'+parts.join('')+'</div>';
      } else if(isToday){
        html+='<div style="font-family:DM Mono,monospace;font-size:.56rem;color:#f5c842;margin-top:3px">TODAY</div>';
      }
      cell.innerHTML=html;
      cell.onclick=()=>selectDate(dateStr);
      calGrid.appendChild(cell);
    }

    // Next month filler
    const cellsUsed=firstDay+daysInMonth;
    const remaining=(7-cellsUsed%7)%7;
    for(let d=1;d<=remaining;d++){
      const cell=document.createElement('div');cell.className='cal-cell other-month';
      cell.innerHTML='<div class="cal-date-num">'+d+'</div>';
      calGrid.appendChild(cell);
    }
    ovCalBox.appendChild(calGrid);

    document.getElementById('ovCalPrev').onclick=()=>{
      ovCalMonth--;if(ovCalMonth<0){ovCalMonth=11;ovCalYear--;}
      buildOvCal();
      if(ovCalSelected){
        const pT=planMap[ovCalSelected]||[],aT=actualMap[ovCalSelected]||[];
        buildOvDayDetail(ovCalSelected,pT,aT,ovCalSelected===localISODate());
      }
    };
    document.getElementById('ovCalNext').onclick=()=>{
      ovCalMonth++;if(ovCalMonth>11){ovCalMonth=0;ovCalYear++;}
      buildOvCal();
      if(ovCalSelected){
        const pT=planMap[ovCalSelected]||[],aT=actualMap[ovCalSelected]||[];
        buildOvDayDetail(ovCalSelected,pT,aT,ovCalSelected===localISODate());
      }
    };

    // Restore the selected day's detail after every live refresh.
    if(!ovCalSelected)ovCalSelected=overviewDate||today;
    buildOvDayDetail(ovCalSelected,planMap[ovCalSelected]||[],actualMap[ovCalSelected]||[],ovCalSelected===today);
  }

  function buildOvDayDetail(dateStr,planTasks,actualTasks,isToday){
    ovDayWrap.innerHTML='';
    const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
    const [y,mo,d]=dateStr.split('-');
    const dateLabel=d+' '+MONTHS[+mo-1]+' '+y;
    const today=localISODate();
    const isPast=dateStr<today;

    const panel=document.createElement('div');panel.className='day-detail';

    // Header
    const phdr=document.createElement('div');phdr.className='day-detail-hdr';
    phdr.innerHTML='<div class="day-detail-title">'
      +'<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>'
      +dateLabel
      +(isToday?'<span class="day-today-badge">TODAY</span>':'')
      +(isPast&&!isToday?'<span class="day-readonly-badge">PAST</span>':'')
      +'</div>'
      +'<div style="display:flex;gap:10px">'
      +(planTasks.length?'<span style="font-family:DM Mono,monospace;font-size:.68rem;background:rgba(59,130,246,.1);color:#60a5fa;border:1px solid rgba(59,130,246,.2);border-radius:20px;padding:2px 10px">'+planTasks.length+' deadline'+(planTasks.length>1?'s':'')+'</span>':'')
      +(actualTasks.length?'<span style="font-family:DM Mono,monospace;font-size:.68rem;background:rgba(62,240,176,.1);color:#3ef0b0;border:1px solid rgba(62,240,176,.2);border-radius:20px;padding:2px 10px">'+actualTasks.length+' completed</span>':'')
      +'</div>';
    panel.appendChild(phdr);

    if(!planTasks.length&&!actualTasks.length){
      panel.insertAdjacentHTML('beforeend','<div class="empty-msg" style="padding:28px">No tasks planned or completed on this date</div>');
      ovDayWrap.appendChild(panel);return;
    }

    const body=document.createElement('div');body.style.cssText='padding:14px 16px;display:flex;flex-direction:column;gap:8px;';

    // Plan deadline tasks
    if(planTasks.length){
      const sh=document.createElement('div');sh.className='ovcal-section-hdr';
      sh.innerHTML='<span style="color:#60a5fa">◈ PLAN DEADLINES — '+planTasks.length+' task'+(planTasks.length>1?'s':'')+'</span>';
      body.appendChild(sh);
      planTasks.forEach(k=>{
        const t2=th(k.person);
        const isOverdue=dateStr<today&&!k.actualDate;
        const isCompleted=!!k.actualDate;
        const card=document.createElement('div');card.className='ovcal-detail-task has-plan';
        if(isCompleted)card.classList.add('has-both');
        card.style.borderLeftColor=isOverdue?'#f87171':isCompleted?'#3ef0b0':'#3b82f6';
        card.innerHTML='<div style="flex:1;min-width:0">'
          +'<div style="font-size:.83rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:4px">'
          +(k.priority?'<span style="color:'+t2.accent+'">★ </span>':'')+k.task+'</div>'
          +'<div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap">'
          +'<span class="ovcal-person-chip"><span style="width:18px;height:18px;border-radius:4px;background:'+t2.bg+';color:'+t2.color+';display:inline-flex;align-items:center;justify-content:center;font-size:.52rem;font-weight:700;font-family:Syne,sans-serif">'+ini(k.person)+'</span><span style="color:'+t2.color+';font-size:.75rem">'+k.person+'</span></span>'
          +(k.planTime?'<span class="time-badge plan" style="font-size:.6rem;padding:2px 6px">⏱ '+k.planTime+'</span>':'')
          +(isCompleted?'<span class="time-badge actual" style="font-size:.6rem;padding:2px 6px">✓ '+formatTime12(k.actualTime)+'</span>':'')
          +(isOverdue?'<span class="time-badge overdue" style="font-size:.6rem;padding:2px 6px">OVERDUE</span>':'')
          +'</div>'
          +'</div>';
        body.appendChild(card);
      });
    }

    // Actual completion tasks (deduplicate from plan list)
    const actualOnly=actualTasks;
    if(actualOnly.length){
      const sh2=document.createElement('div');sh2.className='ovcal-section-hdr';sh2.style.marginTop='10px';
      sh2.innerHTML='<span style="color:#3ef0b0">✓ COMPLETED — '+actualOnly.length+' task'+(actualOnly.length>1?'s':'')+'</span>';
      body.appendChild(sh2);
      actualOnly.forEach(k=>{
        const t2=th(k.person);
        const cmp=timeCmp(k.planDate,k.planTime,k.actualDate,k.actualTime);
        const card=document.createElement('div');card.className='ovcal-detail-task has-actual';
        card.innerHTML='<div style="flex:1;min-width:0">'
          +'<div style="font-size:.83rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:4px">'
          +(k.priority?'<span style="color:'+t2.accent+'">★ </span>':'')+k.task+'</div>'
          +'<div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap">'
          +'<span class="ovcal-person-chip"><span style="width:18px;height:18px;border-radius:4px;background:'+t2.bg+';color:'+t2.color+';display:inline-flex;align-items:center;justify-content:center;font-size:.52rem;font-weight:700;font-family:Syne,sans-serif">'+ini(k.person)+'</span><span style="color:'+t2.color+';font-size:.75rem">'+k.person+'</span></span>'
          +(k.actualTime?'<span class="time-badge actual" style="font-size:.6rem;padding:2px 6px">✓ '+formatTime12(k.actualTime)+'</span>':'')
          +(cmp==='late'?'<span class="time-badge overdue" style="font-size:.6rem;padding:2px 6px">LATE</span>':'')
          +(cmp==='early'||cmp==='ontime'?'<span style="font-family:DM Mono,monospace;font-size:.6rem;color:#3ef0b0">ON TIME</span>':'')
          +'</div>'
          +'</div>';
        body.appendChild(card);
      });
    }

    panel.appendChild(body);
    ovDayWrap.appendChild(panel);
  }

  buildOvCal();
}

// ── DELETE ──
function buildDelete(c){
  c.insertAdjacentHTML('beforeend',`<div style="font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:700;margin-bottom:4px">Delete <span style="color:#f87171">Tasks</span></div>
    <div style="font-size:0.72rem;font-family:'DM Mono',monospace;color:var(--muted);margin-bottom:18px">// PERMANENTLY REMOVE TASKS</div>`);
  const pOpts='<option value="">All Persons</option>'+PERSONS.map(p=>`<option value="${p}">${p}</option>`).join('');
  const fr=document.createElement('div');fr.className='filter-row';
  fr.innerHTML=`<div class="search-wrap"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input type="text" id="dQ" placeholder="Search..."></div>
    <select class="field-select" id="dPF">${pOpts}</select>`;
  c.appendChild(fr);
  const wrap=document.createElement('div');c.appendChild(wrap);
  const draw=()=>{
    const q=(document.getElementById('dQ')?.value||'').toLowerCase();
    const pf=document.getElementById('dPF')?.value||'';
    const fil=tasks.filter(k=>{if(q&&!k.task.toLowerCase().includes(q)&&!k.person.toLowerCase().includes(q))return false;if(pf&&k.person!==pf)return false;return true;});
    wrap.innerHTML='';
    const list=document.createElement('div');list.className='task-list';
    const cols='36px 1fr 130px 120px 70px';
    const hdr=document.createElement('div');hdr.className='tlh';hdr.style.gridTemplateColumns=cols;
    hdr.innerHTML='<span>#</span><span>Task</span><span>Person</span><span>Plan Time</span><span style="text-align:right">Del</span>';
    list.appendChild(hdr);
    if(!fil.length){list.innerHTML+='<div class="empty-msg">NO TASKS FOUND</div>';wrap.appendChild(list);return;}
    fil.forEach((k,i)=>{
      const t2=th(k.person);const row=document.createElement('div');
      row.className='trow'+(k.priority?' priority':'');
      row.style.gridTemplateColumns=cols;row.style.animationDelay=i*0.01+'s';
      if(k.priority)row.style.borderLeftColor=t2.accent;
      row.innerHTML=`<span class="tsl">${k.sl}</span>
        <span class="tname">${k.task}${k.priority?` <span style="color:${t2.accent}">★</span>`:''}</span>
        <span style="display:flex;align-items:center;gap:5px"><span style="width:20px;height:20px;border-radius:5px;background:${t2.bg};color:${t2.color};display:inline-flex;align-items:center;justify-content:center;font-size:0.56rem;font-weight:700;font-family:'Syne',sans-serif">${ini(k.person)}</span><span style="color:${t2.color};font-size:0.8rem">${k.person}</span></span>
        <span>${k.planTime?`<span class="time-badge plan" style="font-size:0.62rem">${clockIcon()} ${k.planTime}</span>`:'<span class="time-badge unset" style="font-size:0.62rem">—</span>'}</span>
        <div style="text-align:right"><button class="act-btn del-btn" data-sl="${k.sl}"><svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M9 6V4h6v2"/></svg>DEL</button></div>`;
      list.appendChild(row);
    });
    wrap.appendChild(list);
    wrap.querySelectorAll('.del-btn').forEach(btn=>{
      btn.onclick=()=>{const sl=+btn.dataset.sl,k=tasks.find(t=>t.sl===sl);if(!k)return;
        confirm2('Delete Task?',`"${k.task}" assigned to ${k.person} will be permanently deleted.`,()=>{tasks=tasks.filter(t=>t.sl!==sl);syncToSheets();toast('Task deleted','error');draw();});};
    });
  };
  draw();
  document.getElementById('dQ').oninput=draw;
  document.getElementById('dPF').onchange=draw;
}

function buildPlanTime(c){

    <span style="color:#60a5fa">Plan Time</span> Manager
    <span style="font-size:0.68rem;font-family:'DM Mono',monospace;background:rgba(245,200,66,0.1);color:#f5c842;border:1px solid rgba(245,200,66,0.25);border-radius:20px;padding:2px 10px;margin-left:10px;vertical-align:middle">ADMIN ONLY</span>

  <div style="font-size:0.72rem;font-family:'DM Mono',monospace;color:var(--muted);margin-bottom:18px">// SET DEADLINE TIMES FOR EACH TASK · USERS CAN ONLY VIEW THESE</div>`);

    if(!fil.length){list.innerHTML+='<div class="empty-msg">NO TASKS FOUND</div>';wrap.appendChild(list);return;}
    fil.forEach((k,i)=>{

          <input type="time" class="time-inp pt-inp" id="pt-${k.sl}" value="${k.planTime||''}" data-sl="${k.sl}" style="width:88px;" title="Plan Time">

    wrap.querySelectorAll('.pt-save').forEach(btn=>{

        if(!timeEl || !timeEl.reportValidity())return;
        const saved=await savePlanTime(sl,timeEl.value,btn);
        if(saved && wrap.isConnected)draw();
      };
    });
  };
  draw();
  document.getElementById('ptQ').oninput=draw;
  document.getElementById('ptPF').onchange=draw;
  document.getElementById('ptShowAll').onclick=()=>{showUnsetOnly=false;draw();};
  document.getElementById('ptShowUnset').onclick=()=>{showUnsetOnly=true;draw();};
}


// ── KPI DASHBOARD ──
function personWorkloadMetrics(person,date){
  const assigned=tasks.filter(task=>task.person===person);
  const totalMinutes=assigned.reduce((sum,task)=>sum+leadMinutes(task.leadTime),0);
  const completedMinutes=assigned.map(task=>taskForDate(task,date)).filter(task=>isTaskComplete(task)&&task.actualDate===date)
    .reduce((sum,task)=>sum+leadMinutes(task.leadTime),0);
  const workingMinutes=dailyMinutes(person,date);
  return {totalMinutes,completedMinutes,workingMinutes,
    utilization:workingMinutes>0?totalMinutes/workingMinutes*100:null,
    efficiency:workingMinutes>0?completedMinutes/workingMinutes*100:null};
}
function workloadPercent(value){return value===null?'—':value.toFixed(1)+'%';}

function buildKPI(c){

    +months.map((m,i)=>'<option value="'+i+'" '+(kpiMonth===String(i)?'selected':'')+'>'+m+'</option>').join('')
    +'</select><button class="dr-clear" id="kpiClear">Clear</button>';

function getKPITasks(){
  return tasks.map(k=>kpiDate?taskForDate(k,kpiDate):k).filter(k=>{
    const d=k.actualDate;
    if(kpiMonth!==''){if(!d)return false;return new Date(d+'T00:00:00').getMonth()===+kpiMonth;}
    if(kpiDate){return d===kpiDate;}
    return false;
  });
}

    }

    // ── LEAD TIME CHART 1: BY PERSON ──
    const parseLT=leadMinutes;

    // Per-person lead time aggregation
    // Lead-time analysis is a permanent master-task view. KPI date/month
    // filters affect Actual performance only, never the saved lead-time plan.
    const leadTimeSource=tasks;
    const leadTimePersons=[...new Set([...PERSONS,...leadTimeSource.map(k=>k.person)])];

      const pt=leadTimeSource.filter(k=>k.person===p&&k.leadTime);

// ── ALL TASKS ──
async function transferTask(sl,newPerson,button){
  if(currentUser!=='admin'){toast('Only the administrator can transfer tasks','error');return false;}
  const task=tasks.find(t=>t.sl===sl);
  if(!task||!teamPersons().includes(newPerson)){toast('Select a valid person','error');return false;}
  if(task.person===newPerson){toast('This task is already assigned to that person','info');return false;}
  const previousPerson=task.person,label=button.textContent;
  button.disabled=true;button.textContent='TRANSFERRING...';
  try{
    await queueTaskWrite(async()=>{
      setSyncStatus('syncing');
      const rows=await dbRequest('tasks','PATCH',
        'sl=eq.'+encodeURIComponent(sl)+'&person=eq.'+postgrestText(previousPerson),
        {person:newPerson});
      if(!Array.isArray(rows)||rows.length!==1||Number(rows[0].sl)!==sl||rows[0].person!==newPerson){
        throw new Error('Transfer not confirmed. Assignment may have changed, or Supabase UPDATE permission is missing.');
      }
      const verified=await dbRequest('tasks','GET','sl=eq.'+encodeURIComponent(sl));
      if(!Array.isArray(verified)||verified.length!==1||verified[0].person!==newPerson){
        throw new Error('Could not verify the new assignment. Refresh before retrying.');
      }
      // Only person is written; lead time, plan and completion are untouched.
      Object.assign(task,rowToTask(verified[0]));rememberTask(task);
      await notifySaved();
    });
    toast('Task #'+sl+' transferred: '+previousPerson+' → '+newPerson,'success');
    renderContent();return true;
  }catch(e){setSyncStatus('error');toast(e.message,'error');return false;}
  finally{button.disabled=false;button.textContent=label;}
}

function buildAllTasks(c){
  const title=document.createElement('div');title.className='section-title';title.textContent='ALL TASKS — '+tasks.length+' TOTAL';c.appendChild(title);
  const canTransfer=currentUser==='admin';
  if(canTransfer){
    const note=document.createElement('p');note.style.cssText='font-size:.8rem;color:var(--muted);margin-bottom:14px';
    note.textContent='Choose a new person and click Transfer. Lead time, plan time and completion records stay unchanged. Other views sync automatically.';
    c.appendChild(note);
  }
  const wrap=document.createElement('div');wrap.style.overflowX='auto';
  const table=document.createElement('table');table.className='pct-table';table.style.minWidth=canTransfer?'1000px':'650px';
  const head=document.createElement('thead');
  head.innerHTML='<tr><th>#</th><th>Task</th><th>Assigned to</th><th>Plan time</th><th>Lead minutes</th>'+(canTransfer?'<th>Transfer to</th>':'')+'</tr>';
  table.appendChild(head);
  const tbody=document.createElement('tbody');
  tasks.forEach(task=>{
    const row=document.createElement('tr');
    [task.sl,(task.priority?'★ ':'')+task.task,task.person,task.planTime?formatTime12(task.planTime):'—',task.leadTime?leadMinutes(task.leadTime):'—'].forEach(value=>{
      const cell=document.createElement('td');cell.textContent=value;row.appendChild(cell);
    });
    if(canTransfer){
      const cell=document.createElement('td'),controls=document.createElement('div');controls.style.cssText='display:flex;align-items:center;gap:8px';
      const select=document.createElement('select');select.className='person-sel';select.style.minWidth='170px';select.setAttribute('aria-label','Transfer task '+task.sl+' to');
      const placeholder=document.createElement('option');placeholder.value='';placeholder.textContent='Select new person';select.appendChild(placeholder);
      teamPersons().filter(person=>person!==task.person).forEach(person=>{
        const option=document.createElement('option');option.value=person;option.textContent=person;select.appendChild(option);
      });
      const button=document.createElement('button');button.type='button';button.className='lead-save';button.textContent='TRANSFER';button.disabled=true;
      select.onchange=()=>{button.disabled=!select.value;};
      button.onclick=async()=>{
        const destination=select.value;select.disabled=true;
        try{await transferTask(task.sl,destination,button);}finally{select.disabled=false;button.disabled=!select.value;}
      };
      controls.append(select,button);cell.appendChild(controls);row.appendChild(cell);
    }
    tbody.appendChild(row);
  });
  if(!tasks.length){const row=document.createElement('tr'),cell=document.createElement('td');cell.colSpan=canTransfer?6:5;cell.textContent='No tasks found';row.appendChild(cell);tbody.appendChild(row);}
  table.appendChild(tbody);wrap.appendChild(table);c.appendChild(wrap);
}

function renderSettingsBody(body){
  body.innerHTML='';
  // Re-mark active nav
  document.querySelectorAll('.snav-btn').forEach(btn=>{
    const lbl=btn.textContent.trim();
    const map={users:'USER MANAGEMENT',access:'MODULE ACCESS',master:'MASTER TASKS',plantime2:'PLAN TIME',leadtime:'LEAD TIME',workinghours:'WORKING HOURS'};
    btn.classList.toggle('active',map[settingsTab]===lbl);
  });
  if(settingsTab==='users')renderSettingsUsers(body);
  else if(settingsTab==='access')renderSettingsAccess(body);
  else if(settingsTab==='master')renderMasterTasks(body);
  else if(settingsTab==='plantime2')renderSettingsPlanTime(body);
  else if(settingsTab==='leadtime')renderSettingsLeadTime(body);
  else if(settingsTab==='workinghours')renderSettingsWorkingHours(body);
}

function leadImportName(name){return String(name||'').normalize('NFKC').trim().replace(/\s+/g,' ').toLowerCase();}
function buildLeadImportPlan(source,remote){
  const sourceCounts=new Map(),byName=new Map();
  source.forEach(([name])=>{const key=leadImportName(name);sourceCounts.set(key,(sourceCounts.get(key)||0)+1);});
  remote.forEach(row=>{const key=leadImportName(row.task);if(!byName.has(key))byName.set(key,[]);byName.get(key).push(row);});
  return source.map(([name,minutes])=>{
    const key=leadImportName(name),matches=byName.get(key)||[];
    const entry={name,minutes};
    if(sourceCounts.get(key)!==1)return {...entry,status:'Duplicate source name — skipped'};
    if(!Number.isFinite(minutes)||minutes<0)return {...entry,status:'Invalid minutes — skipped'};
    if(matches.length===0)return {...entry,status:'No exact name match — skipped'};
    if(matches.length!==1)return {...entry,status:'Duplicate database name — skipped'};
    const row=matches[0];
    if(!Number.isSafeInteger(Number(row.sl)))return {...entry,status:'Invalid task ID — skipped'};
    return {...entry,row,status:row.lead_time!==null&&row.lead_time!==''&&leadMinutes(row.lead_time)===minutes?'Already correct':'Ready'};
  });
}
function postgrestText(value){
  // Simple eq filters take the raw value; wrapping quotes become literal text.
  return encodeURIComponent(String(value));
}
let leadImportView={plan:[],message:'',open:true};
async function applyLeadImportEntry(entry){
  const row=entry.row,value=entry.minutes+'min';
  // Match exact database name and previous lead time as well as ID. A rename
  // or manual edit after preview must cause a conflict, not an overwrite.
  const query='sl=eq.'+encodeURIComponent(row.sl)+'&task=eq.'+postgrestText(row.task)
    +'&lead_time='+(row.lead_time===null?'is.null':'eq.'+postgrestText(row.lead_time||''));
  const matching=await dbRequest('tasks','GET',query+'&select=sl,task,lead_time');
  if(!Array.isArray(matching)||matching.length!==1){
    throw new Error('Preview filter no longer matches one readable task. Preview again.');
  }
  const saved=await dbRequest('tasks','PATCH',query,{lead_time:value});
  if(Array.isArray(saved)&&saved.length===0){
    const error=new Error('Supabase returned zero updated rows for a readable match. Check tasks UPDATE RLS policies or database triggers; no save confirmed.');
    error.stopImport=true;throw error;
  }
  if(!Array.isArray(saved)||saved.length!==1||Number(saved[0].sl)!==Number(row.sl)||
      saved[0].task!==row.task||saved[0].lead_time!==value){
    throw new Error('Task changed since preview or save was not confirmed; reload preview.');
  }
  // Read back from Supabase before reporting success, including after a refresh.
  const verified=await dbRequest('tasks','GET','sl=eq.'+encodeURIComponent(row.sl)+'&select=sl,task,lead_time');
  if(!Array.isArray(verified)||verified.length!==1||verified[0].task!==row.task||
      verified[0].lead_time!==value){
    throw new Error('Write returned but Supabase read-back did not confirm the value. Preview again.');
  }
  const task=tasks.find(t=>t.sl===Number(row.sl));
  if(task)task.leadTime=value;
  const baseline=taskBaseline.get(Number(row.sl));if(baseline)baseline.lead_time=value;
  entry.row={...row,lead_time:value};
}
function renderLeadImportPanel(body,onSaved=()=>{}){
  const panel=document.createElement('details');panel.className='add-panel';
  panel.open=leadImportView.open;panel.ontoggle=()=>{leadImportView.open=panel.open;};
  const summary=document.createElement('summary');summary.textContent='Import supplied lead-time list · 98 task names';summary.style.cursor='pointer';panel.appendChild(summary);
  const note=document.createElement('p');note.style.cssText='margin:12px 0;font-size:.8rem';
  note.textContent='Matches task names only (case and repeated spaces ignored). Serial numbers are not used. Different spelling, punctuation, or duplicate names are skipped. No automatic updates on refresh; future Master Tasks edits stay in your control.';
  panel.appendChild(note);
  const preview=document.createElement('button');preview.type='button';preview.className='fbtn';preview.textContent='PREVIEW MATCHES';
  const apply=document.createElement('button');apply.type='button';apply.className='add-btn';apply.textContent='APPLY MATCHED LEAD TIMES';apply.disabled=true;
  const actions=document.createElement('div');actions.style.cssText='display:flex;flex-wrap:wrap;gap:10px';actions.append(preview,apply);panel.appendChild(actions);
  const status=document.createElement('p');status.setAttribute('role','status');status.style.margin='12px 0';panel.appendChild(status);
  status.textContent=leadImportView.message;
  const setMessage=message=>{leadImportView.message=message;status.textContent=message;};
  const results=document.createElement('div');results.style.cssText='overflow:auto;max-height:440px';panel.appendChild(results);body.appendChild(panel);
  let plan=leadImportView.plan;
  const draw=()=>{
    results.innerHTML='';
    const table=document.createElement('table');table.className='pct-table';table.style.minWidth='650px';
    table.innerHTML='<thead><tr><th>Source task name</th><th>Matched database task</th><th>Current minutes</th><th>New minutes</th><th>Result</th></tr></thead>';
    const tbody=document.createElement('tbody');
    plan.forEach(entry=>{
      const row=document.createElement('tr');
      [entry.name,entry.row?entry.row.task:'—',entry.row&&entry.row.lead_time?leadMinutes(entry.row.lead_time):'—',entry.minutes,entry.status].forEach(value=>{const td=document.createElement('td');td.textContent=value;row.appendChild(td);});
      tbody.appendChild(row);
    });
    table.appendChild(tbody);results.appendChild(table);
  };
  preview.onclick=async()=>{
    if(masterFormDirty||masterBusy){toast('Save or clear the task form first','info');return;}
    preview.disabled=true;apply.disabled=true;setMessage('Reading current task names from Supabase...');
    try{
      // Fetch every page so a truncated task list cannot conceal duplicate names.
      const remote=[];
      for(let offset=0;;offset+=500){
        const rows=await dbRequest('tasks','GET','select=sl,task,lead_time&order=sl.asc&limit=500&offset='+offset);
        if(!Array.isArray(rows))throw new Error('Invalid task list');
        remote.push(...rows);if(rows.length<500)break;
      }
      plan=buildLeadImportPlan(LEAD_IMPORT_20260919,remote);leadImportView.plan=plan;
      const ready=plan.filter(e=>e.status==='Ready').length,correct=plan.filter(e=>e.status==='Already correct').length;
      setMessage(ready+' ready · '+correct+' already correct · '+(plan.length-ready-correct)+' skipped. Review the table before applying.');
      draw();apply.disabled=!ready;
    }catch(e){plan=[];leadImportView.plan=[];results.innerHTML='';setMessage('Preview failed: '+e.message);}
    finally{preview.disabled=false;}
  };
  apply.onclick=async()=>{
    if(masterFormDirty||masterBusy){toast('Save or clear the task form first','info');return;}
    const ready=plan.filter(e=>e.status==='Ready');if(!ready.length)return;
    apply.disabled=true;preview.disabled=true;masterBusy=true;
    // Keep live rerenders from removing the progress/results panel mid-import.
    masterFormDirty=true;
    let saved=0,failed=0;
    try{
      await queueTaskWrite(async()=>{
        for(const entry of ready){
          setMessage('Saving '+(saved+failed+1)+' of '+ready.length+'...');
          try{await applyLeadImportEntry(entry);entry.status='Saved + verified in Supabase';saved++;onSaved();}
          catch(e){entry.status='Not saved: '+e.message;failed++;if(e.stopImport){draw();throw e;}}
          draw();
        }
        if(saved)await notifySaved();
      });
      setMessage(saved+' saved and verified · '+failed+' not saved · '+(plan.length-ready.length)+' unchanged/skipped.'+(saved?' The task list below is updated.':' No lead times were saved.'));
      toast(saved+' lead times saved and verified; '+failed+' failed',failed?'error':'success');
    }catch(e){setMessage('Import interrupted: '+e.message+'. Reload preview before retrying.');}
    finally{
      masterBusy=false;masterFormDirty=false;preview.disabled=false;apply.disabled=true;
    }
  };
  if(plan.length)draw();
  apply.disabled=!plan.some(entry=>entry.status==='Ready');
}

  const initial=masterDraft|| (editing?{...editing}:{task:'',person:'',planDate:'',planTime:'',leadTime:'',priority:false});
  const original=editing?(masterEditBaseline||taskToRow(editing)):null;
  const form=document.createElement('form');form.className='add-panel';
  const title=document.createElement('h4');title.textContent=editing?'Edit Task #'+editing.sl:'Add New Task';form.appendChild(title);
  const fields=document.createElement('div');fields.style.cssText='display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:14px';
  const inputs={};
  const addField=(key,label,type,value)=>{
    const wrap=document.createElement('div');wrap.className='fg';
    const lab=document.createElement('label');lab.textContent=label;lab.htmlFor='master-'+key;
    const input=document.createElement(type==='select'?'select':'input');input.id='master-'+key;input.className=type==='select'?'fi-sel':'fi';
    if(type==='select'){
      const blank=document.createElement('option');blank.value='';blank.textContent='Select person';input.appendChild(blank);
      teamPersons().forEach(p=>{const option=document.createElement('option');option.value=p;option.textContent=p;input.appendChild(option);});
    }else input.type=type;
    if(type==='checkbox'){input.checked=!!value;input.style.width='20px';}else input.value=value;
    if(['task','person'].includes(key))input.required=true;
    if(type==='number'){input.min='0';input.step='any';}
    wrap.append(lab,input);fields.appendChild(wrap);inputs[key]=input;
  };
  addField('task','Task name *','text',initial.task);
  addField('person','Assign to *','select',initial.person);
  addField('planDate','Plan date (optional)','date',initial.planDate||'');
  addField('planTime','Plan time','time',(initial.planTime||'').slice(0,5));
  addField('leadTime','Lead time (minutes)','number',initial.leadTime?leadMinutes(initial.leadTime):'');
  addField('priority','Priority','checkbox',initial.priority);
  form.appendChild(fields);
  const controls=document.createElement('div');controls.style.cssText='display:flex;gap:10px;margin-top:16px';
  const save=document.createElement('button');save.type='submit';save.className='add-btn';save.textContent=editing?'SAVE CHANGES':'ADD TASK';
  const cancel=document.createElement('button');cancel.type='button';cancel.className='fbtn';cancel.textContent='Clear / New Task';
  const reset=()=>{masterEditingId=null;masterDraft=null;masterEditBaseline=null;masterFormDirty=false;body.innerHTML='';renderMasterTasks(body);};
  cancel.onclick=reset;controls.append(save,cancel);form.appendChild(controls);body.appendChild(form);
  const readDraft=()=>({task:inputs.task.value.trim(),person:inputs.person.value,planDate:inputs.planDate.value,planTime:inputs.planTime.value,leadTime:inputs.leadTime.value===''?'':Number(inputs.leadTime.value)+'min',priority:inputs.priority.checked});
  form.oninput=form.onchange=()=>{masterDraft=readDraft();masterFormDirty=true;};
  form.onsubmit=async e=>{
    e.preventDefault();if(masterBusy||!form.reportValidity())return;
    const draft=readDraft();
    if(!draft.task||!draft.person||!teamPersons().includes(draft.person)){toast('Enter a task and select a person','error');return;}
    if(inputs.leadTime.value!==''&&(!Number.isFinite(Number(inputs.leadTime.value))||Number(inputs.leadTime.value)<0)){toast('Enter non-negative lead minutes','error');return;}
    const fields=taskToRow({...draft,sl:editing?.sl||0});delete fields.sl;
    // Existing completions stay intact when assignment or planning fields change.
    delete fields.actual_date;delete fields.actual_time;
    if(original)Object.keys(fields).forEach(key=>{
      const equal=key==='plan_time'?String(fields[key]).slice(0,5)===String(original[key]).slice(0,5):fields[key]===original[key];
      if(equal)delete fields[key];
    });
    if(editing&&!Object.keys(fields).length){toast('No changes to save','info');return;}
    if(!editing){fields.actual_date='';fields.actual_time='';}
    cancel.disabled=true;
    try{if(await saveMasterTask(editing?editing.sl:null,fields,save))reset();}
    finally{cancel.disabled=false;}
  };
  const filters=document.createElement('div');filters.className='filter-row';
  const search=document.createElement('input');search.className='fi';search.placeholder='Search task or person';search.value=masterSearch;search.setAttribute('aria-label','Search tasks');search.style.flex='1';
  const personFilter=document.createElement('select');personFilter.className='fi-sel';personFilter.style.width='220px';personFilter.setAttribute('aria-label','Filter by person');
  [{value:'',text:'All Persons'},...teamPersons().map(p=>({value:p,text:p}))].forEach(p=>{const o=document.createElement('option');o.value=p.value;o.textContent=p.text;personFilter.appendChild(o);});personFilter.value=masterPerson;
  filters.append(search,personFilter);body.appendChild(filters);
  const list=document.createElement('div');list.style.overflowX='auto';body.appendChild(list);
  const draw=()=>{
    list.innerHTML='';
    const table=document.createElement('table');table.className='pct-table';table.style.minWidth='780px';
    const head=document.createElement('thead');head.innerHTML='<tr><th>#</th><th>Task</th><th>Assigned to</th><th>Plan date</th><th>Plan time</th><th>Lead minutes</th><th>Actions</th></tr>';table.appendChild(head);
    const rows=document.createElement('tbody');
    const filtered=tasks.filter(t=>(!masterPerson||t.person===masterPerson)&&(!masterSearch||(t.task+' '+t.person).toLowerCase().includes(masterSearch.toLowerCase())));
    filtered.forEach(task=>{
      const row=document.createElement('tr');
      [task.sl,(task.priority?'★ ':'')+task.task,task.person,task.planDate||'—',task.planTime?formatTime12(task.planTime):'—',task.leadTime?leadMinutes(task.leadTime):'—'].forEach(value=>{const td=document.createElement('td');td.textContent=value;row.appendChild(td);});
      const action=document.createElement('td');const edit=document.createElement('button');edit.className='fbtn';edit.textContent='EDIT';
      edit.onclick=()=>{if(masterBusy)return;masterEditingId=task.sl;masterDraft=null;masterEditBaseline=taskToRow(task);masterFormDirty=false;body.innerHTML='';renderMasterTasks(body);};
      const del=document.createElement('button');del.className='act-btn del-btn';del.textContent='DELETE';
      del.onclick=()=>confirm2('Delete task?',task.task+' will be permanently deleted.',async()=>{
        del.disabled=true;
        try{
          await queueTaskWrite(async()=>{await dbRequest('tasks','DELETE','sl=eq.'+task.sl);tasks=tasks.filter(t=>t.sl!==task.sl);taskBaseline.delete(task.sl);await notifySaved();});
          toast('Task deleted','success');if(masterEditingId===task.sl)reset();else draw();
        }catch(e){toast('Delete failed: '+e.message,'error');del.disabled=false;}
      });
      action.append(edit,del);row.appendChild(action);rows.appendChild(row);
    });
    if(!filtered.length){const row=document.createElement('tr');const td=document.createElement('td');td.colSpan=7;td.textContent='No tasks found';row.appendChild(td);rows.appendChild(row);}
    table.appendChild(rows);list.appendChild(table);
  };
  search.oninput=()=>{masterSearch=search.value;draw();};personFilter.onchange=()=>{masterPerson=personFilter.value;draw();};draw();
}

function renderSettingsWorkingHours(body){
  const heading=document.createElement('h3');heading.textContent='Daily Working Hours';body.appendChild(heading);
  const note=document.createElement('p');note.className='s-section-sub';note.textContent='Choose a date, then save each person’s hours. 0 = off day. Workload shows minutes. Unset dates use the existing default or 8 hours (480 min).';body.appendChild(note);
  const label=document.createElement('label');label.textContent='Working date ';label.htmlFor='hours-date';
  const date=document.createElement('input');date.id='hours-date';date.type='date';date.className='fi';date.style.width='180px';date.value=workingHoursDate;
  date.onchange=()=>{if(date.value){workingHoursDate=date.value;body.innerHTML='';renderSettingsWorkingHours(body);}};
  body.append(label,date);
  const wrap=document.createElement('div');wrap.style.cssText='overflow-x:auto;margin-top:16px';body.appendChild(wrap);
  const table=document.createElement('table');table.className='pct-table';table.style.minWidth='560px';table.innerHTML='<thead><tr><th>Person</th><th>Working minutes</th><th>Hours for selected date</th><th>Save</th></tr></thead>';
  const tbody=document.createElement('tbody');
  teamPersons().forEach(person=>{
    const row=document.createElement('tr'),name=document.createElement('td'),value=document.createElement('td'),edit=document.createElement('td'),action=document.createElement('td');
    name.textContent=person;
    const minutes=dailyMinutes(person,workingHoursDate),saved=Object.prototype.hasOwnProperty.call(dailyWorkingHours,dailyHoursKey(workingHoursDate,person));
    value.textContent=minutes+' min'+(saved?'':' (default)');
    const input=document.createElement('input');input.type='number';input.className='fi';input.min='0';input.max='24';input.step='any';input.value=minutes/60;input.setAttribute('aria-label',person+' working hours');
    const button=document.createElement('button');button.className='lead-save';button.textContent='SAVE';
    button.onclick=async()=>{
      if(input.value===''||!input.reportValidity())return;
      const selectedDate=workingHoursDate;
      if(await saveDailyHours(person,selectedDate,Number(input.value),button)){value.textContent=dailyMinutes(person,selectedDate)+' min';}
    };
    input.onkeydown=e=>{if(e.key==='Enter')button.click();};
    edit.appendChild(input);action.appendChild(button);row.append(name,value,edit,action);tbody.appendChild(row);
  });
  table.appendChild(tbody);wrap.appendChild(table);
}

// ── SECTION 6: LEAD TIME ─────────────────────────
function renderSettingsLeadTime(body){
  body.insertAdjacentHTML('beforeend',
    '<div class="s-section-title">⏱ Lead Time</div>'
    +'<div class="s-section-sub">// SET ESTIMATED MINUTES ALLOCATED PER TASK · SHOWN AS TIME BUDGET</div>'
  );
  // Summary strip
  const withLead=tasks.filter(t=>t.leadTime).length;
  const noLead=tasks.length-withLead;
  body.insertAdjacentHTML('beforeend',
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px">'
    +[{l:'Tasks with Lead Time',v:withLead,c:'#a3e635'},{l:'Not Set',v:noLead,c:'#505870'}]
    .map(x=>'<div style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 16px;display:flex;align-items:center;gap:10px"><span style="font-family:Syne,sans-serif;font-size:1.3rem;font-weight:800;color:'+x.c+'">'+x.v+'</span><span style="font-size:.66rem;font-family:DM Mono,monospace;color:var(--muted)">'+x.l+'</span></div>').join('')
    +'</div>'
  );

  // Bulk set by person
  const pOpts='<option value="">All Persons</option>'+PERSONS.map(p=>`<option value="${p}">${p}</option>`).join('');
  const fr2=document.createElement('div');fr2.className='filter-row';
  fr2.innerHTML='<div class="search-wrap"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input type="text" id="lt-q" placeholder="Search tasks..."></div>'
    +'<select class="field-select" id="lt-pf">'+pOpts+'</select>'
    +'<button class="fbtn" id="lt-unset">Unset Only</button>';
  body.appendChild(fr2);

  // Bulk set panel
  const bulk=document.createElement('div');
  bulk.style.cssText='background:rgba(163,230,53,.04);border:1px solid rgba(163,230,53,.15);border-radius:10px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap';
  bulk.innerHTML='<span style="font-family:DM Mono,monospace;font-size:.68rem;color:#a3e635">BULK SET</span>'
    +'<input type="number" class="lead-inp" id="lt-bulk-val" placeholder="Minutes" min="0" step="1" style="width:100px">'
    +'<button class="lead-save" id="lt-bulk-btn">Apply to Filtered</button>'
    +'<button class="fbtn" id="lt-clear-all" style="font-size:.65rem">Clear All Lead Times</button>';
  body.appendChild(bulk);

  const wrap2=document.createElement('div');wrap2.style.overflowX='auto';body.appendChild(wrap2);
  let ltShowUnset=false;

  const drawLT=()=>{
    const q=(document.getElementById('lt-q')?.value||'').toLowerCase();
    const pf=document.getElementById('lt-pf')?.value||'';
    let fil=tasks.filter(k=>{
      if(q&&!k.task.toLowerCase().includes(q)&&!k.person.toLowerCase().includes(q))return false;
      if(pf&&k.person!==pf)return false;
      if(ltShowUnset&&k.leadTime)return false;
      return true;
    });
    wrap2.innerHTML='';
    const list=document.createElement('div');list.className='task-list';list.style.minWidth='660px';
    const cols='30px minmax(150px,1fr) 100px 90px 160px';
    const hdr=document.createElement('div');hdr.className='tlh';hdr.style.gridTemplateColumns=cols;
    hdr.innerHTML='<span>#</span><span>Task</span><span>Person</span><span>Lead Time</span><span></span>';
    list.appendChild(hdr);
    if(!fil.length){list.innerHTML+='<div class="empty-msg">No tasks found</div>';}
    fil.forEach((k,i)=>{
      const t2=th(k.person);const row=document.createElement('div');
      row.style.cssText='display:grid;grid-template-columns:'+cols+';align-items:center;padding:9px 14px;border-bottom:1px solid var(--border);gap:8px;font-size:.82rem;animation:rowIn .18s ease '+i*0.008+'s both;'+(k.priority?'border-left:3px solid '+t2.accent+';':'');
      const curHrs=k.leadTime?parseFloat(k.leadTime):'';
      row.innerHTML='<span style="font-family:DM Mono,monospace;font-size:.66rem;color:var(--muted)">'+k.sl+'</span>'
        +'<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.8rem">'+k.task+(k.priority?' <span style="color:'+t2.accent+'">★</span>':'')+'</span>'
        +'<span style="color:'+t2.color+';font-size:.74rem">'+k.person.split('/')[0]+'</span>'
        +'<div style="display:flex;align-items:center;gap:5px">'+(k.leadTime?'<span class="lead-badge">'+k.leadTime+'</span>':'<span style="font-family:DM Mono,monospace;font-size:.66rem;color:var(--muted)">—</span>')+'</div>'
        +'<div style="display:flex;align-items:center;gap:5px"><input type="number" class="lead-inp lt-inp" style="width:80px;min-width:0" id="lt-'+k.sl+'" value="'+curHrs+'" placeholder="min" min="0" step="1"><button class="lead-save lt-save" data-sl="'+k.sl+'">'+(k.leadTime?'EDIT':'SAVE')+'</button></div>';
      list.appendChild(row);
    });
    wrap2.appendChild(list);
    wrap2.querySelectorAll('.lt-save').forEach(btn=>{
      btn.onclick=async()=>{
        const sl=+btn.dataset.sl;const k=tasks.find(t=>t.sl===sl);if(!k)return;
        const val=document.getElementById('lt-'+sl)?.value;
        if(val===''||!Number.isFinite(Number(val))||Number(val)<0){toast('Enter valid minutes','error');return;}
        await saveLeadTimes([k],parseFloat(val)+'min',btn);
        if(wrap2.isConnected)drawLT();
      };
    });
    // Bulk
    document.getElementById('lt-bulk-btn').onclick=async()=>{
      const val=document.getElementById('lt-bulk-val')?.value;
      if(val===''||!Number.isFinite(Number(val))||Number(val)<0){toast('Enter valid minutes','error');return;}
      const bulkBtn=document.getElementById('lt-bulk-btn');
      await saveLeadTimes(fil,parseFloat(val)+'min',bulkBtn);
      if(wrap2.isConnected)drawLT();
    };
    document.getElementById('lt-clear-all').onclick=()=>{
      confirm2('Clear All Lead Times?','This will remove lead time from ALL tasks.',async()=>{
        const clearBtn=document.getElementById('lt-clear-all');
        await saveLeadTimes(tasks.slice(),'',clearBtn);
        if(wrap2.isConnected)drawLT();
      });
    };
  };

  drawLT();
  document.getElementById('lt-q').oninput=drawLT;
  document.getElementById('lt-pf').onchange=drawLT;
  document.getElementById('lt-unset').onclick=()=>{ltShowUnset=!ltShowUnset;document.getElementById('lt-unset').classList.toggle('on',ltShowUnset);drawLT();};
}
</script>
</body>
