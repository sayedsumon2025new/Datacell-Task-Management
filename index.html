function clockMinutes(timeStr){
  if(!timeStr)return NaN;
  const [h,m]=String(timeStr).split(':').map(Number);
  if(!Number.isFinite(h)||!Number.isFinite(m))return NaN;
  return h*60+m;
}
function selectedDateLateMinutes(task){
  const plan=clockMinutes(task?.planTime),actual=clockMinutes(task?.actualTime);
  if(!Number.isFinite(plan)||!Number.isFinite(actual))return 0;
  return Math.max(0,actual-plan);
}
function formatLateMinutes(minutes){
  const total=Math.max(0,Math.round(Number(minutes)||0));
  const h=Math.floor(total/60),m=total%60;
  if(h&&m)return h+'h '+m+'m';
  if(h)return h+'h';
  return m+'m';
}
async function openLateDoneModal(person,lateTasks){
  document.querySelectorAll('.kpi-late-modal-overlay').forEach(el=>el.remove());
  await loadTaskRemarksRemote();
  const overlay=document.createElement('div');
  overlay.className='kpi-late-modal-overlay';
  overlay.setAttribute('role','dialog');
  overlay.setAttribute('aria-modal','true');
  overlay.setAttribute('aria-label','Delayed completed reports for '+person);
  const totalLateMinutes=lateTasks.reduce((sum,k)=>sum+selectedDateLateMinutes(k),0);
  const rows=lateTasks.map(k=>{
    const plan=k.planTime?formatTime12(k.planTime):'Not set';
    const actual=k.actualTime?formatTime12(k.actualTime):'—';
    const lateBy=formatLateMinutes(selectedDateLateMinutes(k));
    const remarkDate=k.actualDate||overviewDate||localISODate();
    const reason=(taskRemarkWithFallback(remarkDate,k.sl)||'—').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return '<tr><td class="report">'+k.task+'</td><td class="plan">'+plan+'</td><td class="actual">'+actual+'</td><td class="lateby">'+lateBy+'</td><td class="reason">'+reason+'</td></tr>';
  }).join('');
  overlay.innerHTML='<div class="kpi-late-modal">'
    +'<div class="kpi-late-modal-head"><div><div class="kpi-late-modal-title">Delayed DONE Reports</div><div class="kpi-late-modal-sub">'+person+' · '+lateTasks.length+' delayed report'+(lateTasks.length!==1?'s':'')+'</div></div>'
    +'<button type="button" class="kpi-late-modal-close">CLOSE ✕</button></div>'
    +'<div class="kpi-late-modal-body"><table class="kpi-late-table"><thead><tr><th>Report Name</th><th>Plan Time</th><th>Actual Time</th><th>Late By</th><th>Delayed Reason</th></tr></thead><tbody>'+rows+'</tbody>'
    +'<tfoot><tr><td colspan="3" class="total-label">TOTAL LATE TIME</td><td class="total-late">'+formatLateMinutes(totalLateMinutes)+'</td><td></td></tr></tfoot>'
    +'</table></div>'
    +'</div>';
  const close=()=>{
    document.removeEventListener('keydown',onKey);
    overlay.remove();
  };
  const onKey=e=>{if(e.key==='Escape')close();};
  overlay.addEventListener('click',e=>{if(e.target===overlay)close();});
  overlay.querySelector('.kpi-late-modal-close').onclick=close;
  document.addEventListener('keydown',onKey);
  document.body.appendChild(overlay);
  overlay.querySelector('.kpi-late-modal-close').focus();
}

function leaveInclusiveDays(fromDate,toDate){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(fromDate)||!/^\d{4}-\d{2}-\d{2}$/.test(toDate))return 0;
  const [fy,fm,fd]=fromDate.split('-').map(Number),[ty,tm,td]=toDate.split('-').map(Number);
  const a=Date.UTC(fy,fm-1,fd),b=Date.UTC(ty,tm-1,td);
  if(b<a)return 0;
  return Math.floor((b-a)/86400000)+1;
}
function shortLeaveMinutes(startTime,endTime){
  if(!/^\d{2}:\d{2}$/.test(startTime||'')||!/^\d{2}:\d{2}$/.test(endTime||''))return 0;
  const [sh,sm]=startTime.split(':').map(Number),[eh,em]=endTime.split(':').map(Number);
  const diff=(eh*60+em)-(sh*60+sm);
  return diff>0?diff:0;
}
function formatShortLeaveMinutes(minutes){
  const total=Math.max(0,Math.round(Number(minutes)||0));
  const h=Math.floor(total/60),m=total%60;
  return (h?h+'h ':'')+(m?m+'m':(!h?'0m':'')).trim();
}
function leaveDateTimeDisplay(application,which){
  if(application?.leaveType==='Short Leave'){
    const time=which==='from'?application.shortStartTime:application.shortEndTime;
    return formatDateDisplay(application.fromDate)+(time?' · '+formatTime12(time):'');
  }
  return formatDateDisplay(which==='from'?application.fromDate:application.toDate);
}

function leaveCoverageSqlRows(a){

async function persistLeaveApplication(application){
  if(SQL_TABLES.leave_applications&&SQL_TABLES.leave_report_coverage){
    const rows=await dbRequest('leave_applications','POST','on_conflict=id',
      [leaveApplicationSqlRow(application)],'resolution=merge-duplicates,return=representation');
    if(!Array.isArray(rows)||!rows.some(r=>String(r.id)===String(application.id)))throw new Error('Leave application SQL row was not confirmed');

    const coverageRows=leaveCoverageSqlRows(application);
    const existing=await dbRequest('leave_report_coverage','GET','select=application_id,task_sl&application_id=eq.'+encodeURIComponent(application.id));
    const wanted=new Set(coverageRows.map(r=>String(r.task_sl)));
    for(const row of (existing||[])){
      if(!wanted.has(String(row.task_sl))){
        await dbRequest('leave_report_coverage','DELETE',
          'application_id=eq.'+encodeURIComponent(application.id)+'&task_sl=eq.'+encodeURIComponent(row.task_sl));
      }
    }
    if(coverageRows.length){
      await dbRequest('leave_report_coverage','POST','on_conflict=application_id,task_sl',
        coverageRows,'resolution=merge-duplicates,return=representation');
    }
    const verify=await dbRequest('leave_applications','GET','select=id,status&'+'id=eq.'+encodeURIComponent(application.id));
    if(!Array.isArray(verify)||verify.length!==1||String(verify[0].status)!==String(application.status||'Pending')){
      throw new Error('Leave application SQL read-back did not match');
    }
    return application;
  }

  const key='leaveApplication:'+application.id;
  const rows=await dbRequest('meta','POST','on_conflict=key',
    [{key,value:JSON.stringify(application)}],'resolution=merge-duplicates,return=representation');
  if(!Array.isArray(rows)||!rows.some(r=>r.key===key))throw new Error('Leave application was not confirmed');
  return application;
}

function leaveApplicantRole(application){
  return application.employeeRole||getUserJobRole(application.employee)||'Team Member';
}
function leaveStage(application){
  const role=leaveApplicantRole(application);
  const status=String(application.status||'Pending');
  if(status==='Approved'||status==='Rejected')return 'done';
  if(role==='Team Member'){
    if(application.supervisorStatus==='Approved'||status==='Pending Section Incharge')return 'section';
    return 'supervisor';
  }
  if(role==='Supervisor')return 'section';
  return 'section';
}
function leaveDisplayStatus(application){
  const status=String(application.status||'Pending');
  if(status==='Approved'||status==='Rejected')return status;
  const stage=leaveStage(application);
  return stage==='supervisor'?'Pending Supervisor':'Pending Section Incharge';
}
function leaveStatusClass(status){
  return String(status||'Pending').toLowerCase().replace(/\s+/g,'-');
}
function canActOnLeave(application){
  const role=currentUser==='admin'?'Admin':getUserJobRole(currentUser);
  const stage=leaveStage(application);
  if(String(application.status)==='Approved'||String(application.status)==='Rejected')return false;
  if(currentUser==='admin')return true;
  if(stage==='supervisor')return role==='Supervisor';
  if(stage==='section'){
    if(role!=='Section Incharge')return false;
    // Section Incharge cannot approve their own leave request.
    if(application.employee===currentUser)return false;
    return true;
  }
  return false;
}
function leaveReportTasks(application){
  const employee=String(application?.employee||'').trim();
  if(!employee)return [];
  const isShort=application?.leaveType==='Short Leave';
  const leaveDate=String(application?.fromDate||'');
  const start=String(application?.shortStartTime||'');
  const end=String(application?.shortEndTime||'');
  const shortStartMinutes=/^\d{2}:\d{2}$/.test(start)?Number(start.slice(0,2))*60+Number(start.slice(3,5)):null;
  const shortEndMinutes=/^\d{2}:\d{2}$/.test(end)?Number(end.slice(0,2))*60+Number(end.slice(3,5)):null;

  return tasks.filter(baseTask=>{
    const t=isShort&&leaveDate?taskForDate(baseTask,leaveDate):baseTask;
    const owners=String(t.person||baseTask.person||'').split('/').map(x=>x.trim()).filter(Boolean);
    const owned=t.person===employee||baseTask.person===employee||owners.includes(employee);
    if(!owned)return false;

    if(isShort){
      if(shortStartMinutes===null||shortEndMinutes===null)return false;
      const plan=String(t.planTime||baseTask.planTime||'').slice(0,5);
      if(!/^\d{2}:\d{2}$/.test(plan))return false;
      const planMinutes=Number(plan.slice(0,2))*60+Number(plan.slice(3,5));
      // Only reports whose Plan Time falls inside the Short Leave window need coverage.
      return planMinutes>=shortStartMinutes&&planMinutes<=shortEndMinutes;
    }
    return true;
  }).sort((a,b)=>Number(a.sl)-Number(b.sl));
}
function leaveStoredAssignments(application){
  const a=application&&application.reportAssignments;
  return a&&typeof a==='object'&&!Array.isArray(a)?a:{};
}
function leaveStoredAcceptance(application){
  const a=application&&application.reportAcceptance;
  return a&&typeof a==='object'&&!Array.isArray(a)?a:{};
}
function leaveCoverageState(application){
  const storedAssignments=leaveStoredAssignments(application);
  const storedAcceptance=leaveStoredAcceptance(application);
  const assignments={...storedAssignments};
  const acceptance={...storedAcceptance};

  // Current Multi Skill mapping is authoritative for active/pending leave coverage.
  // This also upgrades leave applications created before Multi Skill was assigned.
  leaveReportTasks(application).forEach(t=>{
    const key=String(t.sl);
    const currentBackup=String(multiSkillMap[key]||storedAssignments[key]||'').trim();
    if(currentBackup)assignments[key]=currentBackup;
    else delete assignments[key];

    const existing=acceptance[key];
    if(currentBackup){
      // If the designated backup changed, old acceptance cannot be reused.
      if(!existing||existing.assignee!==currentBackup){
        acceptance[key]={assignee:currentBackup,status:'Pending',respondedAt:'',respondedBy:''};
      }
    }else{
      delete acceptance[key];
    }
  });
  return {assignments,acceptance};
}
function leaveReportAssignments(application){
  return leaveCoverageState(application).assignments;
}
function leaveReportAcceptance(application){
  return leaveCoverageState(application).acceptance;
}
function leaveBalancingComplete(application){
  const reportTasks=leaveReportTasks(application);
  if(!reportTasks.length)return true;
  const coverage=leaveCoverageState(application);
  return reportTasks.every(t=>{
    const key=String(t.sl);
    const backup=String(coverage.assignments[key]||'').trim();
    const accepted=coverage.acceptance[key]&&String(coverage.acceptance[key].status)==='Accepted';
    return !!backup&&backup!==application.employee&&accepted;
  });
}

async function updateLeaveApproval(application,decision,button){
  if(!['Approved','Rejected'].includes(decision)||!canActOnLeave(application)){
    toast('You are not authorized for this approval stage','error');return false;
  }
  if(decision==='Approved'&&!leaveBalancingComplete(application)){
    toast('Assign all reports in Report Balancing before approving leave','error');
    return false;
  }
  const stage=leaveStage(application);
  const updated={...application};
  const now=new Date().toISOString();
  if(stage==='supervisor'){
    updated.supervisorStatus=decision;
    updated.supervisorBy=currentUser;
    updated.supervisorAt=now;
    if(decision==='Rejected'){
      updated.status='Rejected';
      updated.rejectedStage='Supervisor';
    }else{
      updated.status='Pending Section Incharge';
      updated.sectionStatus='Pending';
    }
  }else{
    updated.sectionStatus=decision;
    updated.sectionBy=currentUser;
    updated.sectionAt=now;
    if(decision==='Rejected'){
      updated.status='Rejected';
      updated.rejectedStage='Section Incharge';
    }else{
      updated.status='Approved';
    }
  }
  const label=button?.textContent||'';
  if(button){button.disabled=true;button.textContent='SAVING...';}
  try{
    await queueTaskWrite(async()=>{
      await persistLeaveApplication(updated);
      await loadLeaveApplicationsRemote();
      const confirmed=leaveApplications.find(a=>a.id===updated.id);
      if(!confirmed||confirmed.status!==updated.status)throw new Error('Approval status did not persist');
      await notifySaved();
    });
    toast((stage==='supervisor'?'Supervisor':'Section Incharge')+' '+decision.toLowerCase()+' saved','success');
    return true;
  }catch(e){toast('Approval not saved: '+e.message,'error');return false;}
  finally{if(button){button.disabled=false;button.textContent=label;}}
}

function renderLeaveStatusReconciliation(panel){

    const visible=(currentUser==='admin'?leaveApplications:leaveApplications.filter(a=>a.employee===currentUser))

    const wrap=document.createElement('div');wrap.className='leave-recent-wrap';
    const table=document.createElement('table');table.className='pct-table';
    table.innerHTML='<thead><tr><th>#</th><th>Employee</th><th>Leave Type</th><th>From</th><th>To</th><th>Days / Duration</th><th>Reason</th><th>Status</th><th>Applied On</th></tr></thead>';

    const isShort=leaveType.value==='Short Leave';

      appliedAt:now.toISOString()
    };

      // Re-read all leave applications so the recent table always reflects Supabase.
      const refreshed=await loadLeaveApplicationsRemote();
      if(refreshed&&panel.isConnected)drawRecent();
    }
  };

}
async function respondToMultiSkill(application,taskSl,decision,button){
  const key=String(taskSl);
  if(!['Accepted','Rejected'].includes(decision))return false;
  const coverage=leaveCoverageState(application);
  const assignments={...coverage.assignments};
  const acceptance={...coverage.acceptance};
  const current=acceptance[key];
  if(!current||current.assignee!==currentUser){toast('This request is not assigned to you','error');return false;}
  acceptance[key]={...current,status:decision,respondedAt:new Date().toISOString(),respondedBy:currentUser};
  const updated={...application,reportAssignments:assignments,reportAcceptance:acceptance};
  updated.balancingComplete=leaveBalancingComplete(updated);
  const label=button?.textContent||'';
  if(button){button.disabled=true;button.textContent='SAVING...';}
  try{
    await queueTaskWrite(async()=>{
      await persistLeaveApplication(updated);
      await loadLeaveApplicationsRemote();
      await notifySaved();
    });
    toast('Report coverage '+decision.toLowerCase(),'success');
    return true;
  }catch(e){toast('Response not saved: '+e.message,'error');return false;}
  finally{if(button){button.disabled=false;button.textContent=label;}}
}
function showPendingMultiSkillPopup(){
  if(!currentUser||currentUser==='admin'||document.querySelector('.multi-skill-modal-overlay'))return;
  const requests=[];
  leaveApplications.filter(a=>!['Approved','Rejected'].includes(String(a.status))).forEach(a=>{
    const coverage=leaveCoverageState(a);
    leaveReportTasks(a).forEach(t=>{
      const key=String(t.sl);
      const r=coverage.acceptance[key];
      const assigned=coverage.assignments[key];
      if(assigned===currentUser&&r&&r.assignee===currentUser&&r.status==='Pending'){
        requests.push({application:a,task:t});
      }
    });
  });
  if(!requests.length)return;
  const overlay=document.createElement('div');overlay.className='multi-skill-modal-overlay';
  overlay.style.cssText='position:fixed;inset:0;z-index:800;background:rgba(4,10,20,.76);display:flex;align-items:center;justify-content:center;padding:20px';
  const modal=document.createElement('div');modal.style.cssText='width:min(780px,96vw);max-height:84vh;overflow:auto;background:#111c2d;border:1px solid rgba(96,165,250,.35);border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.55)';
  modal.innerHTML='<div style="padding:16px 18px;border-bottom:1px solid var(--border)"><div style="font-family:Syne,sans-serif;font-size:1rem;font-weight:700;color:#60a5fa">Multi Skill Coverage Request</div><div style="font-family:DM Mono,monospace;font-size:.62rem;color:var(--muted);margin-top:3px">Accept reports you can cover while the owner is on leave.</div></div>';
  const body=document.createElement('div');body.style.padding='14px 18px';
  requests.forEach(req=>{
    const row=document.createElement('div');row.style.cssText='border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px';
    row.innerHTML='<div style="font-family:Syne,sans-serif;font-size:.86rem;font-weight:700">'+req.task.task+'</div><div style="font-family:DM Mono,monospace;font-size:.62rem;color:var(--muted);margin:4px 0 9px">Owner: '+req.application.employee+' · Leave: '+formatDateDisplay(req.application.fromDate)+' → '+formatDateDisplay(req.application.toDate)+'</div>';
    const acts=document.createElement('div');acts.className='leave-approval-actions';
    const accept=document.createElement('button');accept.className='leave-approve-btn';accept.textContent='ACCEPT';
    const reject=document.createElement('button');reject.className='leave-reject-btn';reject.textContent='REJECT';
    accept.onclick=async()=>{reject.disabled=true;if(await respondToMultiSkill(req.application,req.task.sl,'Accepted',accept)){overlay.remove();setTimeout(showPendingMultiSkillPopup,80);}else reject.disabled=false;};
    reject.onclick=async()=>{accept.disabled=true;if(await respondToMultiSkill(req.application,req.task.sl,'Rejected',reject)){overlay.remove();setTimeout(showPendingMultiSkillPopup,80);}else accept.disabled=false;};
    acts.append(accept,reject);row.appendChild(acts);body.appendChild(row);
  });
  modal.appendChild(body);overlay.appendChild(modal);document.body.appendChild(overlay);
}

  // Always refresh leave + Multi Skill coverage when opening this module.

    if(changed&&currentUser&&adminTab==='leave'){
      renderContent();

  c.insertAdjacentHTML('beforeend',
    '<div style="font-family:Syne,sans-serif;font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin-bottom:4px">Leave <span style="color:#f5c842">Management</span></div>'

async function workHourApprovalLoadState(){
  try{
    const rows=await dbRequest('work_hour_approval_state','GET','id=eq.main&select=report_date,rows');
    const r=Array.isArray(rows)?rows[0]:null;
    return r?{date:r.report_date||'',R:Array.isArray(r.rows)?r.rows:[]}:{date:'',R:[]};
  }catch(e){
    console.error('Work Hour Approval SQL load failed:',e);
    toast('Work Hour Approval data could not be loaded','error');
    return {date:'',R:[]};
  }
}
async function workHourApprovalSaveState(state){
  const payload={
    id:'main',
    report_date:state&&state.date?state.date:null,
    rows:Array.isArray(state?.R)?state.R:[],
    updated_by:currentUser||'',
    updated_at:new Date().toISOString()
  };
  const saved=await dbRequest('work_hour_approval_state','POST','on_conflict=id',
    [payload],'resolution=merge-duplicates,return=representation');
  if(!Array.isArray(saved)||!saved.some(r=>r.id==='main'))throw new Error('Work Hour Approval write was not confirmed');
  await notifySaved();
  return true;
}

async function workHourDepartmentSectionsSave(item){
  const department=String(item?.department||'').trim(),section=String(item?.section||'').trim();
  if(!department||!section)throw new Error('Department and Section are required');
  if(item?.id){
    const rows=await dbRequest('work_hour_department_sections','PATCH',
      'id=eq.'+encodeURIComponent(item.id),
      {department,section,updated_at:new Date().toISOString()});
    if(!Array.isArray(rows)||rows.length!==1)throw new Error('Department / Section update was not confirmed');
    await notifySaved();return rows[0];

  const existing=await dbRequest('work_hour_department_sections','GET','select=sort_order&order=sort_order.desc&limit=1');
  const sortOrder=Math.max(1,Number(existing?.[0]?.sort_order||0)+1);
  const rows=await dbRequest('work_hour_department_sections','POST','',
    {department,section,sort_order:sortOrder,updated_at:new Date().toISOString()});

  await notifySaved();return rows[0];

function buildOverview(c){
  const completedOnDate=k=>isTaskComplete(k)&&(!overviewDate||k.actualDate===overviewDate);
  const allP=[...new Set(tasks.map(t=>t.person))];

  const withActual=totalDone;
  const lateCount=tasks.map(k=>taskForDate(k,overviewDate)).filter(t=>completedOnDate(t)&&selectedDateLateMinutes(t)>0).length;

  c.insertAdjacentHTML('beforeend',`<div class="page-title">Admin <span>Overview</span></div>`);

  const selectDate=value=>{
    overviewDate=value;
    if(value){
      ovCalSelected=value;
      const [year,month]=value.split('-').map(Number);
      ovCalYear=year;ovCalMonth=month-1;
    }
    renderContent();
  };
  dateInput.onchange=()=>{if(dateInput.validity.valid)selectDate(dateInput.value);};
  const todayBtn=document.createElement('button');todayBtn.className='fbtn';
  todayBtn.textContent='Today';todayBtn.onclick=()=>selectDate(localISODate());
  const allBtn=document.createElement('button');allBtn.className='fbtn'+(!overviewDate?' on':'');
  allBtn.textContent='All Dates';allBtn.onclick=()=>selectDate('');
  dateFilter.append(dateLabel,dateInput,todayBtn,allBtn);c.appendChild(dateFilter);
  const filterNote=document.createElement('p');
  filterNote.className='filter-note';filterNote.style.cssText='font-size:.75rem;color:var(--muted);margin-bottom:16px';
  filterNote.textContent=overviewDate
    ? 'Status for '+formatDateDisplay(overviewDate)+' · Based on saved actual completion dates. Pending = current tasks without completion on this date. Auto-refresh every 5 minutes.'
    : 'All saved completion dates · Auto-refresh every 5 minutes.';
  c.appendChild(filterNote);

  // Global stats strip
  const strip=document.createElement('div');
  strip.className='overview-stat-strip';strip.style.cssText='display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px';
  [{l:'Total Tasks',v:tasks.length,c:'#f5c842'},{l:'Completed',v:withActual,c:'#3ef0b0'},{l:'Pending',v:tasks.length-totalDone,c:'#f5c842'},{l:'Completed Late',v:lateCount,c:'#f87171'},{l:'Done Rate',v:pct+'%',c:'#60a5fa'}]
    .forEach(x=>{
      const el=document.createElement('div');
      el.className='overview-stat-card';
      el.style.cssText='background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 16px;display:flex;align-items:center;gap:10px';
      el.innerHTML='<span style="font-family:Syne,sans-serif;font-size:1.4rem;font-weight:800;color:'+x.c+'">'+x.v+'</span><span style="font-size:.66rem;font-family:DM Mono,monospace;color:var(--muted)">'+x.l+'</span>';
      strip.appendChild(el);
    });
  c.appendChild(strip);

  // Overall progress bar
  const prog=document.createElement('div');prog.className='prog-sect';prog.style.marginBottom='18px';
  prog.innerHTML='<div class="prog-info"><span>'+(overviewDate?formatDateDisplay(overviewDate):'ALL DATES')+' · '+totalDone+'/'+tasks.length+' DONE</span><strong style="color:#f5c842">'+pct+'%</strong></div><div class="prog-track"><div class="prog-fill" style="width:'+pct+'%;background:linear-gradient(90deg,#3ef0b0,#f5c842)"></div></div>';
  c.appendChild(prog);

  // Team cards
  const teamLbl=document.createElement('div');teamLbl.className='section-title';teamLbl.textContent='TEAM BREAKDOWN';c.appendChild(teamLbl);
  const grid=document.createElement('div');grid.className='admin-grid';
  allP.forEach(p=>{
    const t2=th(p),mt=tasks.filter(k=>k.person===p).map(k=>taskForDate(k,overviewDate)),dn=mt.filter(completedOnDate).length;
    const pp=mt.length?Math.round((dn/mt.length)*100):0;
    const lateTasks=mt.filter(k=>completedOnDate(k)&&selectedDateLateMinutes(k)>0);
    const late=lateTasks.length;
    const early=mt.filter(k=>completedOnDate(k)&&k.planTime&&k.actualTime&&selectedDateLateMinutes(k)===0).length;
    const card=document.createElement('div');card.className='apc'+(lateTasks.length?' kpi-late-click-card':'');card.style.borderColor=t2.accent+'22';
    if(lateTasks.length){
      card.tabIndex=0;
      card.setAttribute('aria-label',p+' KPI card. Click to view '+lateTasks.length+' delayed completed report'+(lateTasks.length!==1?'s':'')+'.');
    }
    card.innerHTML='<div style="position:absolute;top:0;left:0;right:0;height:2px;background:'+t2.accent+'"></div>'
      +'<div class="apc-hd"><div class="apc-av" style="background:'+t2.bg+';color:'+t2.color+'">'+ini(p)+'</div>'
      +'<div><div class="apc-nm" style="color:'+t2.color+'">'+p+'</div><div class="apc-tk">'+mt.length+' tasks</div></div></div>'
      +'<div class="apc-bar"><div class="apc-fill" style="width:'+pp+'%;background:'+t2.accent+'"></div></div>'
      +'<div class="apc-ct"><span>'+dn+' done</span><span>'+(mt.length-dn)+' pending</span><span style="color:'+t2.color+'">'+pp+'%</span></div>'
      +(early||late?'<div style="margin-top:6px;display:flex;gap:8px;font-size:.62rem;font-family:DM Mono,monospace">'+(early?'<span style="color:#3ef0b0">&#10003;'+early+' ontime</span>':'')+(late?'<span style="color:#f87171">&#10007;'+late+' late</span>':'')+'</div>':'');
    grid.appendChild(card);
    if(lateTasks.length){card.onclick=()=>openLateDoneModal(p,lateTasks);card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openLateDoneModal(p,lateTasks);}};}
  });
  c.appendChild(grid);

  // ── PENDING REPORTS ──
  const pendingDate=overviewDate||localISODate();
  const pendingTasks=tasks.map(k=>taskForDate(k,pendingDate)).filter(k=>!completedOnDate(k));

  function pendingDeadlineState(task){
    if(!task.planTime)return {status:'NO PLAN TIME',overdue:false,label:'—',minutes:0};
    const [y,m,d]=pendingDate.split('-').map(Number);
    const [hh,mm]=String(task.planTime).split(':').map(Number);
    if(![y,m,d,hh,mm].every(Number.isFinite))return {status:'NO PLAN TIME',overdue:false,label:'—',minutes:0};
    const deadline=new Date(y,m-1,d,hh,mm,0,0);
    const now=new Date();
    const diff=Math.round((now-deadline)/60000);
    if(diff>0){
      return {status:'OVERDUE',overdue:true,label:formatLateMinutes(diff),minutes:diff};
    }
    return {status:'ON TRACK',overdue:false,label:formatLateMinutes(Math.abs(diff)),minutes:diff};
  }

  const pendingLbl=document.createElement('div');
  pendingLbl.className='section-title';
  pendingLbl.style.marginTop='24px';
  pendingLbl.textContent='PENDING REPORTS';
  c.appendChild(pendingLbl);

  let pendingPersonFilter=pendingReportFilters.person||'all';
  let pendingStatusFilter=pendingReportFilters.status||'all';
  let pendingPriorityFilter=pendingReportFilters.priority||'all';

  const pendingFilterRow=document.createElement('div');
  pendingFilterRow.className='filter-row';
  pendingFilterRow.style.marginBottom='12px';

  const personSelect=document.createElement('select');
  personSelect.className='field-select';
  personSelect.id='pendingPersonFilter';

  const statusSelect=document.createElement('select');
  statusSelect.className='field-select';
  statusSelect.id='pendingStatusFilter';

  const prioritySelect=document.createElement('select');
  prioritySelect.className='field-select';
  prioritySelect.id='pendingPriorityFilter';

  const resetPendingFilters=document.createElement('button');
  resetPendingFilters.className='fbtn';
  resetPendingFilters.type='button';
  resetPendingFilters.textContent='RESET';

  const personFg=document.createElement('div');personFg.className='fg';personFg.innerHTML='<label>PERSON</label>';personFg.appendChild(personSelect);
  const statusFg=document.createElement('div');statusFg.className='fg';statusFg.innerHTML='<label>STATUS</label>';statusFg.appendChild(statusSelect);
  const priorityFg=document.createElement('div');priorityFg.className='fg';priorityFg.innerHTML='<label>PRIORITY</label>';priorityFg.appendChild(prioritySelect);
  pendingFilterRow.append(personFg,statusFg,priorityFg,resetPendingFilters);
  c.appendChild(pendingFilterRow);

  const pendingWrap=document.createElement('div');
  pendingWrap.className='task-list';
  pendingWrap.style.marginBottom='26px';
  c.appendChild(pendingWrap);

  const baseSortedPending=pendingTasks.slice().sort((a,b)=>{
    const sa=pendingDeadlineState(a),sb=pendingDeadlineState(b);
    if(sa.overdue!==sb.overdue)return sa.overdue?-1:1;
    if(a.planTime&&b.planTime)return a.planTime.localeCompare(b.planTime);
    if(a.planTime)return -1;if(b.planTime)return 1;
    return Number(a.sl)-Number(b.sl);
  });

  function uniqueSorted(values){
    return [...new Set(values.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b)));
  }

  function setSelectOptions(select,allLabel,values,current){
    const valid=new Set(values.map(v=>String(v)));
    const keep=current==='all'||valid.has(String(current))?current:'all';
    select.innerHTML='';
    const all=document.createElement('option');all.value='all';all.textContent=allLabel;select.appendChild(all);
    values.forEach(v=>{
      const opt=document.createElement('option');opt.value=String(v);opt.textContent=String(v);select.appendChild(opt);
    });
    select.value=keep;
    return keep;
  }

  function renderPendingFiltersAndTable(changedLevel){
    // PERSON options always come from the full pending set.
    const persons=uniqueSorted(baseSortedPending.map(k=>k.person));
    pendingPersonFilter=setSelectOptions(personSelect,'All Persons',persons,pendingPersonFilter);

    // STATUS options cascade from selected person.
    const personScoped=baseSortedPending.filter(k=>pendingPersonFilter==='all'||k.person===pendingPersonFilter);
    const statuses=uniqueSorted(personScoped.map(k=>pendingDeadlineState(k).status));
    if(changedLevel==='person'&&!statuses.includes(pendingStatusFilter))pendingStatusFilter='all';
    pendingStatusFilter=setSelectOptions(statusSelect,'All Status',statuses,pendingStatusFilter);

    // PRIORITY options cascade from Person + Status.
    const statusScoped=personScoped.filter(k=>pendingStatusFilter==='all'||pendingDeadlineState(k).status===pendingStatusFilter);
    const priorities=uniqueSorted(statusScoped.map(k=>k.priority?'Priority':'Normal'));
    if((changedLevel==='person'||changedLevel==='status')&&!priorities.includes(pendingPriorityFilter))pendingPriorityFilter='all';
    pendingPriorityFilter=setSelectOptions(prioritySelect,'All Priority',priorities,pendingPriorityFilter);
    pendingReportFilters={person:pendingPersonFilter,status:pendingStatusFilter,priority:pendingPriorityFilter};

    const filtered=statusScoped.filter(k=>{
      if(pendingPriorityFilter==='all')return true;
      return (k.priority?'Priority':'Normal')===pendingPriorityFilter;
    });

    pendingWrap.innerHTML='';

    const pendingHdr=document.createElement('div');
    pendingHdr.className='tlh';
    pendingHdr.style.gridTemplateColumns='42px minmax(260px,1.6fr) minmax(150px,.8fr) 130px 120px 130px';
    pendingHdr.innerHTML='<span>#</span><span>REPORT / TASK</span><span>PERSON</span><span>PLAN TIME</span><span>STATUS</span><span>OVERDUE / TIME LEFT</span>';
    pendingWrap.appendChild(pendingHdr);

    if(!filtered.length){
      const empty=document.createElement('div');
      empty.className='empty-msg';
      empty.style.padding='28px';
      empty.textContent='No pending reports match the selected filters';
      pendingWrap.appendChild(empty);
    }else{
      filtered.forEach((k,i)=>{
        const t2=th(k.person);
        const state=pendingDeadlineState(k);
        const row=document.createElement('div');
        row.className='trow';
        row.style.gridTemplateColumns='42px minmax(260px,1.6fr) minmax(150px,.8fr) 130px 120px 130px';
        row.style.animationDelay=(i*0.015)+'s';
        if(state.overdue)row.style.borderLeft='3px solid #f87171';

        const statusColor=state.status==='OVERDUE'?'#f87171':state.status==='ON TRACK'?'#3ef0b0':'#94a3b8';
        const timeLabel=state.status==='OVERDUE'
          ? state.label+' late'
          : state.status==='ON TRACK'
            ? state.label+' left'
            : '—';

        row.innerHTML='<span class="tsl">'+k.sl+'</span>'
          +'<span class="tname">'+(k.priority?'<span style="color:'+t2.accent+'">★ </span>':'')+k.task+'</span>'
          +'<span style="display:flex;align-items:center;gap:6px;min-width:0"><span style="width:20px;height:20px;border-radius:5px;background:'+t2.bg+';color:'+t2.color+';display:inline-flex;align-items:center;justify-content:center;font-size:.56rem;font-weight:700;font-family:Syne,sans-serif;flex-shrink:0">'+ini(k.person)+'</span><span style="color:'+t2.color+';font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+k.person+'</span></span>'
          +'<span>'+(k.planTime?'<span class="time-badge plan" style="font-size:.62rem">◷ '+formatTime12(k.planTime)+'</span>':'<span class="time-badge unset" style="font-size:.62rem">Not set</span>')+'</span>'
          +'<span style="font-family:DM Mono,monospace;font-size:.64rem;font-weight:700;color:'+statusColor+'">'+state.status+'</span>'
          +'<span style="font-family:DM Mono,monospace;font-size:.64rem;color:'+statusColor+'">'+timeLabel+'</span>';
        pendingWrap.appendChild(row);
      });
    }

    const pendingSummary=document.createElement('div');
    pendingSummary.style.cssText='display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 0';
    const overdueCount=filtered.filter(k=>pendingDeadlineState(k).overdue).length;
    const onTrackCount=filtered.filter(k=>pendingDeadlineState(k).status==='ON TRACK').length;
    const noPlanCount=filtered.filter(k=>pendingDeadlineState(k).status==='NO PLAN TIME').length;
    pendingSummary.innerHTML=
      '<span style="font-family:DM Mono,monospace;font-size:.64rem;color:#f5c842">'+filtered.length+' PENDING</span>'
      +'<span style="font-family:DM Mono,monospace;font-size:.64rem;color:#f87171">'+overdueCount+' OVERDUE</span>'
      +'<span style="font-family:DM Mono,monospace;font-size:.64rem;color:#3ef0b0">'+onTrackCount+' ON TRACK</span>'
      +(noPlanCount?'<span style="font-family:DM Mono,monospace;font-size:.64rem;color:var(--muted)">'+noPlanCount+' NO PLAN TIME</span>':'');
    pendingWrap.appendChild(pendingSummary);
  }

  personSelect.onchange=()=>{
    pendingPersonFilter=personSelect.value;
    renderPendingFiltersAndTable('person');
  };
  statusSelect.onchange=()=>{
    pendingStatusFilter=statusSelect.value;
    renderPendingFiltersAndTable('status');
  };
  prioritySelect.onchange=()=>{
    pendingPriorityFilter=prioritySelect.value;
    renderPendingFiltersAndTable('priority');
  };
  resetPendingFilters.onclick=()=>{
    pendingPersonFilter='all';
    pendingStatusFilter='all';
    pendingPriorityFilter='all';
    pendingReportFilters={person:'all',status:'all',priority:'all'};
    renderPendingFiltersAndTable('reset');
  };

  renderPendingFiltersAndTable('init');}

async function syncActiveLeaveCoverageFromMultiSkill(){
  if(!(SQL_TABLES.leave_applications&&SQL_TABLES.leave_report_coverage))return;
  for(const application of leaveApplications.filter(a=>!['Approved','Rejected'].includes(String(a.status)))){
    const coverage=leaveCoverageState(application);
    const updated={...application,reportAssignments:coverage.assignments,reportAcceptance:coverage.acceptance};
    updated.balancingComplete=leaveBalancingComplete(updated);
    await persistLeaveApplication(updated);
  }
  await loadLeaveApplicationsRemote();
}
async function saveMultiSkillMap(nextMap,button){
  const label=button?.textContent||'';
  if(button){button.disabled=true;button.textContent='SAVING...';}
  try{
    await queueTaskWrite(async()=>{
      if(SQL_TABLES.multi_skill_assignments){
        const remote=await dbRequest('multi_skill_assignments','GET','select=task_sl,backup_person');
        const remoteMap=Object.fromEntries((remote||[]).map(r=>[String(Number(r.task_sl)),String(r.backup_person||'')]));
        for(const key of Object.keys(remoteMap)){
          if(!(key in nextMap))await dbRequest('multi_skill_assignments','DELETE','task_sl=eq.'+encodeURIComponent(key));
        }
        const rows=Object.entries(nextMap).filter(([,person])=>person).map(([task_sl,backup_person])=>({task_sl:Number(task_sl),backup_person}));
        if(rows.length)await dbRequest('multi_skill_assignments','POST','on_conflict=task_sl',rows,'resolution=merge-duplicates,return=representation');
        const verify=await dbRequest('multi_skill_assignments','GET','select=task_sl,backup_person');
        const confirmed=Object.fromEntries((verify||[]).map(r=>[String(Number(r.task_sl)),String(r.backup_person||'')]));
        if(JSON.stringify(confirmed)!==JSON.stringify(nextMap))throw new Error('Saved Multi Skill mapping does not match');
        multiSkillMap=confirmed;
        await syncActiveLeaveCoverageFromMultiSkill();
      }else{
        const rows=await dbRequest('meta','POST','on_conflict=key',
          [{key:'multiSkillMap',value:JSON.stringify(nextMap)}],'resolution=merge-duplicates,return=representation');
        if(!Array.isArray(rows)||!rows.some(r=>r.key==='multiSkillMap'))throw new Error('Multi Skill mapping was not confirmed');
        multiSkillMap={...nextMap};
      }
      await notifySaved();
    });
    toast('Multi Skill assignment saved','success');
    return true;
  }catch(e){toast('Multi Skill not saved: '+e.message,'error');return false;}
  finally{if(button){button.disabled=false;button.textContent=label;}}
}

function personWorkloadMetrics(person,date){
  const assigned=tasks.filter(task=>task.person===person);
  const totalMinutes=assigned.reduce((sum,task)=>sum+leadMinutes(task.leadTime),0);
  const completedMinutes=assigned.map(task=>taskForDate(task,date)).filter(task=>isTaskComplete(task)&&task.actualDate===date)
    .reduce((sum,task)=>sum+leadMinutes(task.leadTime),0);
  const workingMinutes=dailyMinutes(person,date);
  return {totalMinutes,completedMinutes,workingMinutes,
    utilization:workingMinutes>0?totalMinutes/workingMinutes*100:null,
    efficiency:workingMinutes>0?completedMinutes/workingMinutes*100:null};
}

    if(pCtx&&typeof Chart!=='undefined')new Chart(pCtx,{type:'bar',data:{labels:pData.map(x=>x.n),datasets:[{label:'Done',data:pData.map(x=>x.d),backgroundColor:pData.map(x=>th(x.n).accent+'cc'),borderRadius:4},{label:'Pending',data:pData.map(x=>Math.max(x.t-x.d,0)),backgroundColor:'rgba(80,88,112,0.35)',borderRadius:4}]},plugins:[valueLabelPlugin],options:{...cd,responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{...cd.plugins,inlineValueLabels:{color:'#edf2f8'}},scales:{x:{stacked:true,beginAtZero:true,grid:{color:'rgba(31,37,53,.6)'},ticks:{color:'#76859a',precision:0}},y:{stacked:true,grid:{display:false},ticks:{color:'#dde1ec',font:{size:10},autoSkip:false}}}}});

    // Priority
    const prCtx=document.getElementById('chartPrio')?.getContext('2d');
    const nPrios=tasks.filter(k=>!k.priority);const nDone=filtered.filter(k=>!k.priority&&isTaskComplete(k)).length;
    if(prCtx&&typeof Chart!=='undefined')new Chart(prCtx,{type:'bar',data:{labels:['Priority ★','Normal'],datasets:[{label:'Done',data:[prioDone,nDone],backgroundColor:['rgba(232,121,249,.7)','rgba(62,240,176,.6)'],borderRadius:6},{label:'Pending',data:[Math.max(prios.length-prioDone,0),Math.max(nPrios.length-nDone,0)],backgroundColor:['rgba(232,121,249,.2)','rgba(62,240,176,.15)'],borderRadius:6}]},plugins:[valueLabelPlugin],options:{...cd,plugins:{...cd.plugins,inlineValueLabels:{color:'#edf2f8'}},scales:{x:{grid:{color:'rgba(31,37,53,.6)'},ticks:{color:'#dde1ec'}},y:{beginAtZero:true,grid:{color:'rgba(31,37,53,.6)'},ticks:{color:'#76859a',precision:0}}}}});
    // Timeline
    const tlCtx=document.getElementById('chartTimeline')?.getContext('2d');
    const withDates=filtered.filter(k=>k.actualDate);
    const dateMap={};withDates.forEach(k=>{if(!dateMap[k.actualDate])dateMap[k.actualDate]={on:0,late:0};if(k.planTime&&k.actualTime&&selectedDateLateMinutes(k)>0)dateMap[k.actualDate].late++;else if(k.planTime&&k.actualTime)dateMap[k.actualDate].on++;});
    const sortedD=Object.keys(dateMap).sort();
    if(tlCtx&&typeof Chart!=='undefined'){
      if(sortedD.length)new Chart(tlCtx,{type:'bar',data:{labels:sortedD.map(d=>fmtDate(d)),datasets:[{label:'On-Time',data:sortedD.map(d=>dateMap[d].on),backgroundColor:'rgba(62,240,176,.65)',borderRadius:4},{label:'Late',data:sortedD.map(d=>dateMap[d].late),backgroundColor:'rgba(248,113,113,.65)',borderRadius:4}]},plugins:[valueLabelPlugin],options:{...cd,plugins:{...cd.plugins,inlineValueLabels:{color:'#edf2f8'}},scales:{x:{stacked:true,grid:{display:false},ticks:{color:'#76859a',maxRotation:35}},y:{stacked:true,beginAtZero:true,grid:{color:'rgba(31,37,53,.6)'},ticks:{color:'#76859a',precision:0}}}}});
      else tlCtx.canvas.closest('.chart-box').insertAdjacentHTML('beforeend','<p style="font-size:.75rem;color:var(--muted);text-align:center;padding:30px;font-family:DM Mono,monospace">No completed data for the selected date.</p>');
    }
    // Table
    const tbody=document.getElementById('kpiTableBody');
    if(tbody){
      // This table intentionally reads only completed Actual records. The
      // master task list remains unchanged by KPI date/month filtering.
      const actualFiltered=tasks.map(k=>kpiDate?taskForDate(k,kpiDate):k).filter(k=>{
        if(!k.actualDate||!k.actualTime)return false;
        if(kpiDate)return k.actualDate===kpiDate;
        if(kpiMonth!=='')return new Date(k.actualDate+'T00:00:00').getMonth()===+kpiMonth;
        return true;
      });
      // PERSON and TASKS come from the unfiltered ALL TASKS master list.
      // Only performance figures use the selected Actual Date/month.
      const teamPersons=[...new Set([...PERSONS,...tasks.map(k=>k.person)])];
      const teamSummary={tasks:0,done:0,pending:0,onTime:0,late:0,totalMinutes:0,completedMinutes:0,workingMinutes:0};
      teamPersons.forEach(p=>{
        const masterTasks=tasks.filter(k=>k.person===p);
        const mt=actualFiltered.filter(k=>k.person===p);
        const t2=th(p);
        const dn=mt.length;
        const pending=Math.max(masterTasks.length-dn,0);
        const comparableMt=mt.filter(k=>k.planTime&&k.actualTime);
        const ot=comparableMt.filter(k=>selectedDateLateMinutes(k)===0).length;
        const lt=comparableMt.filter(k=>selectedDateLateMinutes(k)>0).length;
        const rate=masterTasks.length?Math.round(dn/masterTasks.length*100):0;
        const metrics=personWorkloadMetrics(p,workloadDate);
        teamSummary.tasks+=masterTasks.length;
        teamSummary.done+=dn;
        teamSummary.pending+=pending;
        teamSummary.onTime+=ot;
        teamSummary.late+=lt;
        teamSummary.totalMinutes+=metrics.totalMinutes;
        teamSummary.completedMinutes+=metrics.completedMinutes;
        teamSummary.workingMinutes+=metrics.workingMinutes;
        const tr=document.createElement('tr');
        tr.innerHTML='<td><span style="display:inline-flex;align-items:center;gap:7px"><span style="width:22px;height:22px;border-radius:6px;background:'+t2.bg+';color:'+t2.color+';display:inline-flex;align-items:center;justify-content:center;font-size:.55rem;font-weight:700;font-family:Syne,sans-serif">'+ini(p)+'</span><span style="color:'+t2.color+'">'+p+'</span></span></td>'
          +'<td style="font-family:DM Mono,monospace;font-size:.8rem">'+masterTasks.length+'</td>'
          +'<td style="color:#3ef0b0;font-family:DM Mono,monospace;font-size:.8rem">'+dn+'</td>'
          +'<td style="color:#f87171;font-family:DM Mono,monospace;font-size:.8rem">'+pending+'</td>'
          +'<td style="color:#3ef0b0;font-family:DM Mono,monospace;font-size:.8rem">'+(ot||'—')+'</td>'
          +'<td style="color:#f87171;font-family:DM Mono,monospace;font-size:.8rem">'+(lt||'—')+'</td>'
          +'<td><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;height:4px;background:var(--border);border-radius:4px;min-width:50px"><div style="height:100%;width:'+rate+'%;background:'+t2.accent+';border-radius:4px"></div></div><span style="font-family:DM Mono,monospace;font-size:.72rem;color:'+t2.color+'">'+rate+'%</span></div></td>';
        const utilizationCell=document.createElement('td');
        utilizationCell.textContent=workloadPercent(metrics.utilization);
        utilizationCell.title=metrics.totalMinutes+' / '+metrics.workingMinutes+' minutes'+(metrics.workingMinutes===0?' · No working capacity':'');
        const efficiencyCell=document.createElement('td');
        efficiencyCell.textContent=workloadPercent(metrics.efficiency);
        efficiencyCell.title=metrics.completedMinutes+' / '+metrics.workingMinutes+' minutes'+(metrics.workingMinutes===0?' · No working capacity':'');
        [utilizationCell,efficiencyCell].forEach(cell=>{cell.style.cssText='font-family:DM Mono,monospace;font-size:.8rem;white-space:nowrap;color:#60a5fa';tr.appendChild(cell);});
        const timingUnknown=Math.max(0,dn-ot-lt);
        const timingNote=timingUnknown?' · '+timingUnknown+' completed task(s) have no comparable plan time':'';
        [{count:ot,label:'On-time',color:'#3ef0b0'},{count:lt,label:'Delayed',color:'#f87171'}].forEach(item=>{

          const efficiency=teamSummary.workingMinutes>0?teamSummary.completedMinutes/teamSummary.workingMinutes*100:null;

    }

    // ── LEAD TIME CHART 1: BY PERSON ──
    const parseLT=leadMinutes;

    // Per-person lead time aggregation
    // Lead-time analysis is a permanent master-task view. KPI date/month
    // filters affect Actual performance only, never the saved lead-time plan.
    const leadTimeSource=tasks;
    const leadTimePersons=[...new Set([...PERSONS,...leadTimeSource.map(k=>k.person)])];

          data:{

            datasets:[
              {label:'Done min',data:ltPersonData.map(x=>x.done),backgroundColor:ltPersonData.map(x=>th(x.name).accent+'cc'),borderRadius:4,borderSkipped:false},
              {label:'Remaining min',data:ltPersonData.map(x=>x.pend),backgroundColor:ltPersonData.map(x=>th(x.name).accent+'33'),borderRadius:4,borderSkipped:false},

            indexAxis:'y',
            scales:{

            },
            plugins:{
              ...cd.plugins,
              legend:{position:'top',labels:{color:'#505870',font:{size:9}}},
              tooltip:{
                ...cd.plugins.tooltip,
                callbacks:{
                  label:ctx=>{
                    const d=ltPersonData[ctx.dataIndex];
                    if(ctx.datasetIndex===0)return' Done: '+d.done+'m ('+d.count+' tasks)';
                    return' Remaining: '+d.pend+'m';
                  },
                  afterBody:items=>{
                    const d=ltPersonData[items[0].dataIndex];
                    const vs=d.total-avgHrs;
                    return['Total: '+d.total+'m','vs Avg: '+(vs>=0?'+':'')+vs.toFixed(1)+'m '+(vs>0?'⬆ Overloaded':'⬇ Under avg')];
                  }

              },
              // avg reference line annotation (manual via dataset)
            },
            // draw avg line as annotation-like dataset

        const avgLinePlugin={id:'avgLine',afterDraw:chart=>{

      }

    // ── LEAD TIME CHART 2: BY TASK (top 20) ──
    const ltTaskData=leadTimeSource.filter(k=>k.leadTime)
      .map(k=>({task:k.task.length>28?k.task.slice(0,28)+'…':k.task,hrs:parseLT(k.leadTime),person:k.person,done:isTaskComplete(k),priority:k.priority}))
      .sort((a,b)=>b.hrs-a.hrs)

            +'<span style="color:'+t2.color+'">'+x.name+'</span></span></td>'

          ltTbody.appendChild(tr);

        // Avg row
        const avgTr=document.createElement('tr');
        avgTr.style.cssText='background:rgba(245,200,66,.04);border-top:1px solid rgba(245,200,66,.15)';
        avgTr.innerHTML='<td style="font-family:DM Mono,monospace;font-size:.72rem;color:#f5c842;letter-spacing:.06em" colspan="2">TEAM AVERAGE</td>'
          +'<td style="color:#60a5fa">'+(ltPersonData.length?Math.round(ltPersonData.reduce((sum,x)=>sum+dailyMinutes(x.name,workloadDate),0)/ltPersonData.length):0)+'m / person</td>'
          +'<td style="font-family:DM Mono,monospace;font-size:.8rem;color:#f5c842;font-weight:600">'+totalLeadHrs.toFixed(1)+'m total</td>'

// ── ALL TASKS ──
async function transferTask(sl,newPerson,button){
  if(currentUser!=='admin'){toast('Only the administrator can transfer tasks','error');return false;}
  const task=tasks.find(t=>t.sl===sl);
  if(!task||!teamPersons().includes(newPerson)){toast('Select a valid person','error');return false;}
  if(task.person===newPerson){toast('This task is already assigned to that person','info');return false;}
  const previousPerson=task.person,label=button.textContent;
  button.disabled=true;button.textContent='TRANSFERRING...';
  try{
    await queueTaskWrite(async()=>{
      setSyncStatus('syncing');
      const rows=await dbRequest('tasks','PATCH',
        'sl=eq.'+encodeURIComponent(sl)+'&person=eq.'+postgrestText(previousPerson),
        {person:newPerson});
      if(!Array.isArray(rows)||rows.length!==1||Number(rows[0].sl)!==sl||rows[0].person!==newPerson){
        throw new Error('Transfer not confirmed. Assignment may have changed, or Supabase UPDATE permission is missing.');
      }
      const verified=await dbRequest('tasks','GET','sl=eq.'+encodeURIComponent(sl));
      if(!Array.isArray(verified)||verified.length!==1||verified[0].person!==newPerson){
        throw new Error('Could not verify the new assignment. Refresh before retrying.');
      }
      // Only person is written; lead time, plan and completion are untouched.
      Object.assign(task,rowToTask(verified[0]));rememberTask(task);
      await notifySaved();
    });
    toast('Task #'+sl+' transferred: '+previousPerson+' → '+newPerson,'success');
    renderContent();return true;
  }catch(e){setSyncStatus('error');toast(e.message,'error');return false;}
  finally{button.disabled=false;button.textContent=label;}
}

function buildAllTasks(c){
  const title=document.createElement('div');title.className='section-title';title.textContent='ALL TASKS — '+tasks.length+' TOTAL';c.appendChild(title);
  const canTransfer=currentUser==='admin';
  if(canTransfer){
    const note=document.createElement('p');note.style.cssText='font-size:.8rem;color:var(--muted);margin-bottom:14px';
    note.textContent='Choose a new person and click Transfer. Lead time, plan time and completion records stay unchanged. Other views sync automatically.';
    c.appendChild(note);
  }
  const wrap=document.createElement('div');wrap.style.overflowX='auto';
  const table=document.createElement('table');table.className='pct-table';table.style.minWidth=canTransfer?'1000px':'650px';
  const head=document.createElement('thead');
  head.innerHTML='<tr><th>#</th><th>Task</th><th>Assigned to</th><th>Plan time</th><th>Lead minutes</th>'+(canTransfer?'<th>Transfer to</th>':'')+'</tr>';
  table.appendChild(head);
  const tbody=document.createElement('tbody');
  tasks.forEach(task=>{
    const row=document.createElement('tr');
    [task.sl,(task.priority?'★ ':'')+task.task,task.person,task.planTime?formatTime12(task.planTime):'—',task.leadTime?leadMinutes(task.leadTime):'—'].forEach(value=>{
      const cell=document.createElement('td');cell.textContent=value;row.appendChild(cell);
    });
    if(canTransfer){
      const cell=document.createElement('td'),controls=document.createElement('div');controls.style.cssText='display:flex;align-items:center;gap:8px';
      const select=document.createElement('select');select.className='person-sel';select.style.minWidth='170px';select.setAttribute('aria-label','Transfer task '+task.sl+' to');
      const placeholder=document.createElement('option');placeholder.value='';placeholder.textContent='Select new person';select.appendChild(placeholder);
      teamPersons().filter(person=>person!==task.person).forEach(person=>{
        const option=document.createElement('option');option.value=person;option.textContent=person;select.appendChild(option);
      });
      const button=document.createElement('button');button.type='button';button.className='lead-save';button.textContent='TRANSFER';button.disabled=true;
      select.onchange=()=>{button.disabled=!select.value;};
      button.onclick=async()=>{
        const destination=select.value;select.disabled=true;
        try{await transferTask(task.sl,destination,button);}finally{select.disabled=false;button.disabled=!select.value;}
      };
      controls.append(select,button);cell.appendChild(controls);row.appendChild(cell);
    }
    tbody.appendChild(row);
  });
  if(!tasks.length){const row=document.createElement('tr'),cell=document.createElement('td');cell.colSpan=canTransfer?6:5;cell.textContent='No tasks found';row.appendChild(cell);tbody.appendChild(row);}
  table.appendChild(tbody);wrap.appendChild(table);c.appendChild(wrap);
}

function renderSettingsBody(body){
  body.innerHTML='';
  // Re-mark active nav
  document.querySelectorAll('.snav-btn').forEach(btn=>{
    const lbl=btn.textContent.trim();
    const map={users:'USER MANAGEMENT',access:'MODULE ACCESS',master:'MASTER TASKS',plantime2:'PLAN TIME',leadtime:'LEAD TIME',workinghours:'WORKING HOURS'};
    btn.classList.toggle('active',map[settingsTab]===lbl);
  });
  if(settingsTab==='users')renderSettingsUsers(body);
  else if(settingsTab==='access')renderSettingsAccess(body);
  else if(settingsTab==='master')renderMasterTasks(body);
  else if(settingsTab==='plantime2')renderSettingsPlanTime(body);
  else if(settingsTab==='leadtime')renderSettingsLeadTime(body);
  else if(settingsTab==='workinghours')renderSettingsWorkingHours(body);
}

function hexToRgb(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return r+','+g+','+b;
}

function leadImportName(name){return String(name||'').normalize('NFKC').trim().replace(/\s+/g,' ').toLowerCase();}
function buildLeadImportPlan(source,remote){
  const sourceCounts=new Map(),byName=new Map();
  source.forEach(([name])=>{const key=leadImportName(name);sourceCounts.set(key,(sourceCounts.get(key)||0)+1);});
  remote.forEach(row=>{const key=leadImportName(row.task);if(!byName.has(key))byName.set(key,[]);byName.get(key).push(row);});
  return source.map(([name,minutes])=>{
    const key=leadImportName(name),matches=byName.get(key)||[];
    const entry={name,minutes};
    if(sourceCounts.get(key)!==1)return {...entry,status:'Duplicate source name — skipped'};
    if(!Number.isFinite(minutes)||minutes<0)return {...entry,status:'Invalid minutes — skipped'};
    if(matches.length===0)return {...entry,status:'No exact name match — skipped'};
    if(matches.length!==1)return {...entry,status:'Duplicate database name — skipped'};
    const row=matches[0];
    if(!Number.isSafeInteger(Number(row.sl)))return {...entry,status:'Invalid task ID — skipped'};
    return {...entry,row,status:row.lead_time!==null&&row.lead_time!==''&&leadMinutes(row.lead_time)===minutes?'Already correct':'Ready'};
  });
}
function postgrestText(value){
  // Simple eq filters take the raw value; wrapping quotes become literal text.
  return encodeURIComponent(String(value));
}
let leadImportView={plan:[],message:'',open:true};
async function applyLeadImportEntry(entry){
  const row=entry.row,value=entry.minutes+'min';
  // Match exact database name and previous lead time as well as ID. A rename
  // or manual edit after preview must cause a conflict, not an overwrite.
  const query='sl=eq.'+encodeURIComponent(row.sl)+'&task=eq.'+postgrestText(row.task)
    +'&lead_time='+(row.lead_time===null?'is.null':'eq.'+postgrestText(row.lead_time||''));
  const matching=await dbRequest('tasks','GET',query+'&select=sl,task,lead_time');
  if(!Array.isArray(matching)||matching.length!==1){
    throw new Error('Preview filter no longer matches one readable task. Preview again.');
  }
  const saved=await dbRequest('tasks','PATCH',query,{lead_time:value});
  if(Array.isArray(saved)&&saved.length===0){
    const error=new Error('Supabase returned zero updated rows for a readable match. Check tasks UPDATE RLS policies or database triggers; no save confirmed.');
    error.stopImport=true;throw error;
  }
  if(!Array.isArray(saved)||saved.length!==1||Number(saved[0].sl)!==Number(row.sl)||
      saved[0].task!==row.task||saved[0].lead_time!==value){
    throw new Error('Task changed since preview or save was not confirmed; reload preview.');
  }
  // Read back from Supabase before reporting success, including after a refresh.
  const verified=await dbRequest('tasks','GET','sl=eq.'+encodeURIComponent(row.sl)+'&select=sl,task,lead_time');
  if(!Array.isArray(verified)||verified.length!==1||verified[0].task!==row.task||
      verified[0].lead_time!==value){
    throw new Error('Write returned but Supabase read-back did not confirm the value. Preview again.');
  }
  const task=tasks.find(t=>t.sl===Number(row.sl));
  if(task)task.leadTime=value;
  const baseline=taskBaseline.get(Number(row.sl));if(baseline)baseline.lead_time=value;
  entry.row={...row,lead_time:value};
}
function renderLeadImportPanel(body,onSaved=()=>{}){
  const panel=document.createElement('details');panel.className='add-panel';
  panel.open=leadImportView.open;panel.ontoggle=()=>{leadImportView.open=panel.open;};
  const summary=document.createElement('summary');summary.textContent='Import supplied lead-time list · 98 task names';summary.style.cursor='pointer';panel.appendChild(summary);
  const note=document.createElement('p');note.style.cssText='margin:12px 0;font-size:.8rem';
  note.textContent='Matches task names only (case and repeated spaces ignored). Serial numbers are not used. Different spelling, punctuation, or duplicate names are skipped. No automatic updates on refresh; future Master Tasks edits stay in your control.';
  panel.appendChild(note);
  const preview=document.createElement('button');preview.type='button';preview.className='fbtn';preview.textContent='PREVIEW MATCHES';
  const apply=document.createElement('button');apply.type='button';apply.className='add-btn';apply.textContent='APPLY MATCHED LEAD TIMES';apply.disabled=true;

  const results=document.createElement('div');results.style.cssText='overflow:auto;max-height:440px';panel.appendChild(results);body.appendChild(panel);
  let plan=leadImportView.plan;
  const draw=()=>{
    results.innerHTML='';
    const table=document.createElement('table');table.className='pct-table';table.style.minWidth='650px';
    table.innerHTML='<thead><tr><th>Source task name</th><th>Matched database task</th><th>Current minutes</th><th>New minutes</th><th>Result</th></tr></thead>';
    const tbody=document.createElement('tbody');
    plan.forEach(entry=>{
      const row=document.createElement('tr');
      [entry.name,entry.row?entry.row.task:'—',entry.row&&entry.row.lead_time?leadMinutes(entry.row.lead_time):'—',entry.minutes,entry.status].forEach(value=>{const td=document.createElement('td');td.textContent=value;row.appendChild(td);});

  preview.onclick=async()=>{
    if(masterFormDirty||masterBusy){toast('Save or clear the task form first','info');return;}
    preview.disabled=true;apply.disabled=true;setMessage('Reading current task names from Supabase...');
    try{
      // Fetch every page so a truncated task list cannot conceal duplicate names.
      const remote=[];
      for(let offset=0;;offset+=500){
        const rows=await dbRequest('tasks','GET','select=sl,task,lead_time&order=sl.asc&limit=500&offset='+offset);
        if(!Array.isArray(rows))throw new Error('Invalid task list');
        remote.push(...rows);if(rows.length<500)break;
      }
      plan=buildLeadImportPlan(LEAD_IMPORT_20260919,remote);leadImportView.plan=plan;
      const ready=plan.filter(e=>e.status==='Ready').length,correct=plan.filter(e=>e.status==='Already correct').length;
      setMessage(ready+' ready · '+correct+' already correct · '+(plan.length-ready-correct)+' skipped. Review the table before applying.');
      draw();apply.disabled=!ready;
    }catch(e){plan=[];leadImportView.plan=[];results.innerHTML='';setMessage('Preview failed: '+e.message);}
    finally{preview.disabled=false;}
  };
  apply.onclick=async()=>{
    if(masterFormDirty||masterBusy){toast('Save or clear the task form first','info');return;}
    const ready=plan.filter(e=>e.status==='Ready');if(!ready.length)return;
    apply.disabled=true;preview.disabled=true;masterBusy=true;
    // Keep live rerenders from removing the progress/results panel mid-import.
    masterFormDirty=true;
    let saved=0,failed=0;
    try{
      await queueTaskWrite(async()=>{
        for(const entry of ready){
          setMessage('Saving '+(saved+failed+1)+' of '+ready.length+'...');
          try{await applyLeadImportEntry(entry);entry.status='Saved + verified in Supabase';saved++;onSaved();}
          catch(e){entry.status='Not saved: '+e.message;failed++;if(e.stopImport){draw();throw e;}}
          draw();
        }
        if(saved)await notifySaved();
      });
      setMessage(saved+' saved and verified · '+failed+' not saved · '+(plan.length-ready.length)+' unchanged/skipped.'+(saved?' The task list below is updated.':' No lead times were saved.'));
      toast(saved+' lead times saved and verified; '+failed+' failed',failed?'error':'success');
    }catch(e){setMessage('Import interrupted: '+e.message+'. Reload preview before retrying.');}
    finally{
      masterBusy=false;masterFormDirty=false;preview.disabled=false;apply.disabled=true;
    }
  };
  if(plan.length)draw();
  apply.disabled=!plan.some(entry=>entry.status==='Ready');
}

  const heading=document.createElement('h3');heading.textContent='Daily Working Hours';body.appendChild(heading);
  const note=document.createElement('p');note.className='s-section-sub';note.textContent='Choose a date, then save each person’s hours. 0 = off day. Workload shows minutes. Unset dates use the existing default or 8 hours (480 min).';body.appendChild(note);
  const label=document.createElement('label');label.textContent='Working date ';label.htmlFor='hours-date';
  const date=document.createElement('input');date.id='hours-date';date.type='date';date.className='fi';date.style.width='180px';date.value=workingHoursDate;
  date.onchange=()=>{if(date.value){workingHoursDate=date.value;body.innerHTML='';renderSettingsWorkingHours(body);}};
  body.append(label,date);
  const today=localISODate();
  const isPastDate=workingHoursDate<today;
  if(isPastDate){
    const warning=document.createElement('div');
    warning.style.cssText='margin-top:12px;padding:10px 12px;border-radius:9px;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.25);color:#f87171;font-family:DM Mono,monospace;font-size:.66rem';
    warning.textContent='LOCKED: Historical Working Hours are view-only. Past dates cannot be edited.';
    body.appendChild(warning);
  }
  const wrap=document.createElement('div');wrap.style.cssText='overflow-x:auto;margin-top:16px';body.appendChild(wrap);
  const table=document.createElement('table');table.className='pct-table';table.style.minWidth='560px';table.innerHTML='<thead><tr><th>Person</th><th>Working minutes</th><th>Hours for selected date</th><th>Save</th></tr></thead>';
  const tbody=document.createElement('tbody');
  teamPersons().forEach(person=>{
    const row=document.createElement('tr'),name=document.createElement('td'),value=document.createElement('td'),edit=document.createElement('td'),action=document.createElement('td');
    name.textContent=person;
    const minutes=dailyMinutes(person,workingHoursDate),saved=Object.prototype.hasOwnProperty.call(dailyWorkingHours,dailyHoursKey(workingHoursDate,person));
    value.textContent=minutes+' min'+(saved?'':' (default)');
    const input=document.createElement('input');input.type='number';input.className='fi';input.min='0';input.max='24';input.step='any';input.value=minutes/60;input.setAttribute('aria-label',person+' working hours');
    const button=document.createElement('button');button.className='lead-save';button.textContent=isPastDate?'LOCKED':'SAVE';
    if(isPastDate){
      input.disabled=true;
      button.disabled=true;
      input.title='Past-date Working Hours are view-only';
      button.title='Past-date Working Hours are locked';
    }
    button.onclick=async()=>{
      if(input.value===''||!input.reportValidity())return;
      const selectedDate=workingHoursDate;
      if(await saveDailyHours(person,selectedDate,Number(input.value),button)){value.textContent=dailyMinutes(person,selectedDate)+' min';}
    };
    input.onkeydown=e=>{if(e.key==='Enter')button.click();};
    edit.appendChild(input);action.appendChild(button);row.append(name,value,edit,action);tbody.appendChild(row);
  });
  table.appendChild(tbody);wrap.appendChild(table);
}

// ── SECTION 6: LEAD TIME ─────────────────────────
function renderSettingsLeadTime(body){
  body.insertAdjacentHTML('beforeend',
    '<div class="s-section-title">⏱ Lead Time</div>'
    +'<div class="s-section-sub">// SET ESTIMATED MINUTES ALLOCATED PER TASK · SHOWN AS TIME BUDGET</div>'
  );
  // Summary strip
  const withLead=tasks.filter(t=>t.leadTime).length;
  const noLead=tasks.length-withLead;
  body.insertAdjacentHTML('beforeend',
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px">'
    +[{l:'Tasks with Lead Time',v:withLead,c:'#a3e635'},{l:'Not Set',v:noLead,c:'#505870'}]
    .map(x=>'<div style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 16px;display:flex;align-items:center;gap:10px"><span style="font-family:Syne,sans-serif;font-size:1.3rem;font-weight:800;color:'+x.c+'">'+x.v+'</span><span style="font-size:.66rem;font-family:DM Mono,monospace;color:var(--muted)">'+x.l+'</span></div>').join('')
    +'</div>'
  );

  // Bulk set by person
  const pOpts='<option value="">All Persons</option>'+PERSONS.map(p=>`<option value="${p}">${p}</option>`).join('');
  const fr2=document.createElement('div');fr2.className='filter-row';
  fr2.innerHTML='<div class="search-wrap"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input type="text" id="lt-q" placeholder="Search tasks..."></div>'
    +'<select class="field-select" id="lt-pf">'+pOpts+'</select>'
    +'<button class="fbtn" id="lt-unset">Unset Only</button>';
  body.appendChild(fr2);

  // Bulk set panel
  const bulk=document.createElement('div');
  bulk.style.cssText='background:rgba(163,230,53,.04);border:1px solid rgba(163,230,53,.15);border-radius:10px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap';
  bulk.innerHTML='<span style="font-family:DM Mono,monospace;font-size:.68rem;color:#a3e635">BULK SET</span>'
    +'<input type="number" class="lead-inp" id="lt-bulk-val" placeholder="Minutes" min="0" step="1" style="width:100px">'
    +'<button class="lead-save" id="lt-bulk-btn">Apply to Filtered</button>'
    +'<button class="fbtn" id="lt-clear-all" style="font-size:.65rem">Clear All Lead Times</button>';
  body.appendChild(bulk);

  const wrap2=document.createElement('div');wrap2.style.overflowX='auto';body.appendChild(wrap2);
  let ltShowUnset=false;

  const drawLT=()=>{
    const q=(document.getElementById('lt-q')?.value||'').toLowerCase();
    const pf=document.getElementById('lt-pf')?.value||'';
    let fil=tasks.filter(k=>{
      if(q&&!k.task.toLowerCase().includes(q)&&!k.person.toLowerCase().includes(q))return false;
      if(pf&&k.person!==pf)return false;
      if(ltShowUnset&&k.leadTime)return false;
      return true;
    });
    wrap2.innerHTML='';
    const list=document.createElement('div');list.className='task-list';list.style.minWidth='660px';
    const cols='30px minmax(150px,1fr) 100px 90px 160px';
    const hdr=document.createElement('div');hdr.className='tlh';hdr.style.gridTemplateColumns=cols;
    hdr.innerHTML='<span>#</span><span>Task</span><span>Person</span><span>Lead Time</span><span></span>';
    list.appendChild(hdr);
    if(!fil.length){list.innerHTML+='<div class="empty-msg">No tasks found</div>';}
    fil.forEach((k,i)=>{
      const t2=th(k.person);const row=document.createElement('div');
      row.style.cssText='display:grid;grid-template-columns:'+cols+';align-items:center;padding:9px 14px;border-bottom:1px solid var(--border);gap:8px;font-size:.82rem;animation:rowIn .18s ease '+i*0.008+'s both;'+(k.priority?'border-left:3px solid '+t2.accent+';':'');
      const curHrs=k.leadTime?parseFloat(k.leadTime):'';
      row.innerHTML='<span style="font-family:DM Mono,monospace;font-size:.66rem;color:var(--muted)">'+k.sl+'</span>'
        +'<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.8rem">'+k.task+(k.priority?' <span style="color:'+t2.accent+'">★</span>':'')+'</span>'
        +'<span style="color:'+t2.color+';font-size:.74rem">'+k.person.split('/')[0]+'</span>'
        +'<div style="display:flex;align-items:center;gap:5px">'+(k.leadTime?'<span class="lead-badge">'+k.leadTime+'</span>':'<span style="font-family:DM Mono,monospace;font-size:.66rem;color:var(--muted)">—</span>')+'</div>'
        +'<div style="display:flex;align-items:center;gap:5px"><input type="number" class="lead-inp lt-inp" style="width:80px;min-width:0" id="lt-'+k.sl+'" value="'+curHrs+'" placeholder="min" min="0" step="1"><button class="lead-save lt-save" data-sl="'+k.sl+'">'+(k.leadTime?'EDIT':'SAVE')+'</button></div>';
      list.appendChild(row);
    });
    wrap2.appendChild(list);
    wrap2.querySelectorAll('.lt-save').forEach(btn=>{
      btn.onclick=async()=>{
        const sl=+btn.dataset.sl;const k=tasks.find(t=>t.sl===sl);if(!k)return;
        const val=document.getElementById('lt-'+sl)?.value;
        if(val===''||!Number.isFinite(Number(val))||Number(val)<0){toast('Enter valid minutes','error');return;}
        await saveLeadTimes([k],parseFloat(val)+'min',btn);
        if(wrap2.isConnected)drawLT();
      };
    });
    // Bulk
    document.getElementById('lt-bulk-btn').onclick=async()=>{
      const val=document.getElementById('lt-bulk-val')?.value;
      if(val===''||!Number.isFinite(Number(val))||Number(val)<0){toast('Enter valid minutes','error');return;}
      const bulkBtn=document.getElementById('lt-bulk-btn');
      await saveLeadTimes(fil,parseFloat(val)+'min',bulkBtn);
      if(wrap2.isConnected)drawLT();
    };
    document.getElementById('lt-clear-all').onclick=()=>{
      confirm2('Clear All Lead Times?','This will remove lead time from ALL tasks.',async()=>{
        const clearBtn=document.getElementById('lt-clear-all');
        await saveLeadTimes(tasks.slice(),'',clearBtn);
        if(wrap2.isConnected)drawLT();
      });
    };
  };

  drawLT();
  document.getElementById('lt-q').oninput=drawLT;
  document.getElementById('lt-pf').onchange=drawLT;
  document.getElementById('lt-unset').onclick=()=>{ltShowUnset=!ltShowUnset;document.getElementById('lt-unset').classList.toggle('on',ltShowUnset);drawLT();};
}
</script>
</body>
</html>
